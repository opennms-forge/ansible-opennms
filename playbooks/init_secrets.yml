---
# One-time bootstrap that generates database credentials, persists them in an
# Ansible Vault file inside the operator's inventory, and prints the recommended
# ansible.cfg snippet for the operator to wire into their own configuration.
#
# Usage:
#   ansible-playbook -i <your inventory> indigo423.opennms.init_secrets
#
# Flags:
#   -e force_rotate=true    Regenerate credential values; keep the vault password.
#   -e force_reinit=true    Regenerate everything (DESTROYS the existing vault).
#
# See the collection README for the full operator workflow.

- name: Bootstrap OpenNMS credentials into Ansible Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vault_pass_dir: "{{ lookup('env', 'HOME') }}/.config/ansible-opennms"
    vault_pass_path: "{{ vault_pass_dir }}/vault-pass"
    secrets_group: opennms_stack
    # Operator can override the discovered path explicitly with
    #   -e secrets_dest_dir=/path/to/inventory-or-group_vars-parent
    secrets_dest_dir: ""
    force_rotate: false
    force_reinit: false

  tasks:
    - name: Assert an inventory source was provided
      ansible.builtin.assert:
        that:
          - ansible_inventory_sources is defined
          - ansible_inventory_sources | length > 0
        fail_msg: >-
          No inventory source detected. Invoke with `-i <inventory>` so the
          bootstrap knows where to write group_vars files, or pass
          `-e secrets_dest_dir=<path>` to set the target directory explicitly.

    - name: Refuse multiple inventory sources without an explicit destination
      ansible.builtin.assert:
        that:
          - (ansible_inventory_sources | length == 1) or (secrets_dest_dir | length > 0)
        fail_msg: >-
          Multiple inventory sources passed via -i ({{ ansible_inventory_sources | length }}).
          Re-run with a single -i, or pass `-e secrets_dest_dir=<path>` to choose
          which inventory's group_vars should hold the vault.

    - name: Stat the (first) inventory source so we can tell file vs directory
      ansible.builtin.stat:
        path: "{{ ansible_inventory_sources | first }}"
      register: inventory_source_stat
      when: secrets_dest_dir | length == 0

    - name: Resolve bootstrap_inventory_dir
      ansible.builtin.set_fact:
        bootstrap_inventory_dir: >-
          {{ secrets_dest_dir
             if (secrets_dest_dir | length > 0)
             else (
               (ansible_inventory_sources | first)
               if (inventory_source_stat.stat.isdir | default(false))
               else ((ansible_inventory_sources | first) | dirname)
             ) }}

    - name: Assert bootstrap_inventory_dir resolved to a usable path
      ansible.builtin.assert:
        that:
          - bootstrap_inventory_dir | length > 0
          - bootstrap_inventory_dir != "."
        fail_msg: >-
          Could not resolve a usable inventory directory from
          {{ ansible_inventory_sources | first }}. Pass an absolute path via
          `-i /abs/path/to/inventory.yml` or `-e secrets_dest_dir=<path>`.

    - name: Compute group_vars target paths
      ansible.builtin.set_fact:
        group_vars_dir: "{{ bootstrap_inventory_dir }}/group_vars/{{ secrets_group }}"
        vault_yml_path: "{{ bootstrap_inventory_dir }}/group_vars/{{ secrets_group }}/vault.yml"
        vars_yml_path: "{{ bootstrap_inventory_dir }}/group_vars/{{ secrets_group }}/vars.yml"

    - name: Show resolved bootstrap paths
      ansible.builtin.debug:
        msg:
          - "Inventory directory: {{ bootstrap_inventory_dir }}"
          - "Group vars target:   {{ group_vars_dir }}"
          - "Vault password file: {{ vault_pass_path }}"

    - name: Detect ANSIBLE_VAULT_PASSWORD_FILE in environment
      ansible.builtin.set_fact:
        env_vault_pass_file: "{{ lookup('env', 'ANSIBLE_VAULT_PASSWORD_FILE') }}"

    - name: Notice — ANSIBLE_VAULT_PASSWORD_FILE matches bootstrap path
      ansible.builtin.debug:
        msg: >-
          ANSIBLE_VAULT_PASSWORD_FILE is set to {{ env_vault_pass_file }} (matches
          bootstrap path). No additional ansible.cfg configuration required.
      when:
        - env_vault_pass_file | length > 0
        - env_vault_pass_file == vault_pass_path

    - name: Warning — ANSIBLE_VAULT_PASSWORD_FILE conflicts with bootstrap path
      ansible.builtin.debug:
        msg: >-
          ANSIBLE_VAULT_PASSWORD_FILE is set to {{ env_vault_pass_file }}, which
          differs from the bootstrap's chosen path ({{ vault_pass_path }}).
          Subsequent plays may resolve the wrong vault password. Decide which
          configuration your plays will use.
      when:
        - env_vault_pass_file | length > 0
        - env_vault_pass_file != vault_pass_path

    - name: Ensure vault-password directory exists
      ansible.builtin.file:
        path: "{{ vault_pass_dir }}"
        state: directory
        mode: "0700"

    - name: Stat existing vault-pass file
      ansible.builtin.stat:
        path: "{{ vault_pass_path }}"
      register: vault_pass_stat

    - name: Stat existing vault.yml
      ansible.builtin.stat:
        path: "{{ vault_yml_path }}"
      register: vault_yml_stat

    - name: Fail-fast on lost master key
      ansible.builtin.fail:
        msg: |
          Cannot proceed: {{ vault_pass_path }} is missing but {{ vault_yml_path }} exists.
          The existing vault is unreadable without the master key.
          Options:
            - Restore {{ vault_pass_path }} from a backup, or
            - Re-run with `-e force_reinit=true` to regenerate everything (DESTROYS the existing vault)
      when:
        - not vault_pass_stat.stat.exists
        - vault_yml_stat.stat.exists
        - not (force_reinit | bool)

    - name: Loud warning — force_reinit destroys recoverability
      ansible.builtin.debug:
        msg: |
          force_reinit=true: regenerating vault password AND all credentials.
          Any previously-encrypted vault.yml is now unrecoverable.
          The deployment playbook will rotate PostgreSQL and SCV credentials on next run.
          Cold-recovery may require manual ALTER USER on PostgreSQL — see the collection README.
      when: force_reinit | bool

    - name: Decide whether vault-pass needs (re)generation
      ansible.builtin.set_fact:
        needs_new_vault_pass: "{{ (not vault_pass_stat.stat.exists) or (force_reinit | bool) }}"

    # The two-step (write to tempfile, then atomically move) flow ensures that
    # a failure or interruption never leaves the operator without ANY vault
    # password file. The old vault-pass is only replaced once the new one is
    # written and synced.
    - name: Generate new vault password (fresh randomness; do not persist via lookup)
      ansible.builtin.set_fact:
        _new_vault_pass: >-
          {{ lookup('ansible.builtin.password',
                    '/dev/null length=64 chars=ascii_letters,digits') }}
      no_log: true
      when: needs_new_vault_pass

    - name: Create tempfile for new vault-pass
      ansible.builtin.tempfile:
        state: file
        suffix: .vault-pass
      register: vault_pass_tmp
      no_log: true
      when: needs_new_vault_pass

    - name: Write new vault password into tempfile
      ansible.builtin.copy:
        content: "{{ _new_vault_pass }}"
        dest: "{{ vault_pass_tmp.path }}"
        mode: "0600"
      no_log: true
      when: needs_new_vault_pass

    - name: Atomically move new vault-pass into place
      ansible.builtin.command:
        cmd: mv {{ vault_pass_tmp.path | quote }} {{ vault_pass_path | quote }}
      changed_when: true
      no_log: true
      when: needs_new_vault_pass

    - name: Remove existing vault.yml (force_reinit; AFTER new vault-pass is in place)
      ansible.builtin.file:
        path: "{{ vault_yml_path }}"
        state: absent
      when: force_reinit | bool

    - name: Lock down vault-pass file permissions
      ansible.builtin.file:
        path: "{{ vault_pass_path }}"
        mode: "0600"

    - name: Ensure group_vars directory exists
      ansible.builtin.file:
        path: "{{ group_vars_dir }}"
        state: directory
        mode: "0755"

    - name: Re-stat vault.yml after any force_reinit cleanup
      ansible.builtin.stat:
        path: "{{ vault_yml_path }}"
      register: vault_yml_stat

    - name: Read first line of existing vault.yml to detect encryption
      ansible.builtin.slurp:
        src: "{{ vault_yml_path }}"
      register: vault_yml_slurp
      when: vault_yml_stat.stat.exists

    - name: Determine encryption state of vault.yml
      ansible.builtin.set_fact:
        vault_yml_encrypted: >-
          {{ vault_yml_stat.stat.exists
             and (vault_yml_slurp.content | b64decode).startswith('$ANSIBLE_VAULT') }}

    - name: Decrypt existing vault.yml to preserve values
      ansible.builtin.command:
        cmd: >-
          ansible-vault view
          --vault-password-file {{ vault_pass_path | quote }}
          {{ vault_yml_path | quote }}
      register: vault_view
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - vault_yml_encrypted
        - not (force_rotate | bool)

    - name: Surface a tailored error if the vault could not be decrypted
      ansible.builtin.fail:
        msg: |
          ansible-vault view failed against {{ vault_yml_path }}.
          The vault password file at {{ vault_pass_path }} may have been
          corrupted, replaced, or never matched this vault.

          Options:
            - Restore {{ vault_pass_path }} from a backup, or
            - Re-run with `-e force_reinit=true` to regenerate everything
              (DESTROYS the existing vault).
      when:
        - vault_view is defined
        - vault_view.rc is defined
        - vault_view.rc != 0

    - name: Parse existing vault values
      ansible.builtin.set_fact:
        existing_vault: "{{ vault_view.stdout | from_yaml }}"
      no_log: true
      when:
        - vault_yml_encrypted
        - not (force_rotate | bool)
        - vault_view is defined
        - vault_view.stdout is defined

    - name: Decide whether vault.yml needs to be (re)written
      ansible.builtin.set_fact:
        vault_needs_write: >-
          {{ (not vault_yml_encrypted)
             or (force_rotate | bool)
             or (force_reinit | bool)
             or (existing_vault is not defined)
             or ('vault_opennms_db_password' not in existing_vault)
             or ('vault_postgres_password' not in existing_vault) }}

    - name: Generate or reuse vault_opennms_db_password
      ansible.builtin.set_fact:
        vault_opennms_db_password: >-
          {{ existing_vault.vault_opennms_db_password
             if (existing_vault is defined
                 and 'vault_opennms_db_password' in existing_vault
                 and not (force_rotate | bool))
             else lookup('ansible.builtin.password',
                         '/dev/null length=32 chars=ascii_letters,digits') }}
      no_log: true

    - name: Generate or reuse vault_postgres_password
      ansible.builtin.set_fact:
        vault_postgres_password: >-
          {{ existing_vault.vault_postgres_password
             if (existing_vault is defined
                 and 'vault_postgres_password' in existing_vault
                 and not (force_rotate | bool))
             else lookup('ansible.builtin.password',
                         '/dev/null length=32 chars=ascii_letters,digits') }}
      no_log: true

    - name: Encrypt and install vault.yml without leaving plaintext in the inventory tree
      when: vault_needs_write
      block:
        - name: Create plaintext tempfile in the controller's temp directory
          ansible.builtin.tempfile:
            state: file
            suffix: .vault.yml
          register: vault_tmp
          no_log: true

        - name: Write plaintext vault content to tempfile
          ansible.builtin.copy:
            content: |
              ---
              # Encrypted by indigo423.opennms.init_secrets. Edit via:
              #   ansible-vault edit --vault-password-file {{ vault_pass_path }} {{ vault_yml_path }}
              vault_opennms_db_password: "{{ vault_opennms_db_password }}"
              vault_postgres_password: "{{ vault_postgres_password }}"
            dest: "{{ vault_tmp.path }}"
            mode: "0600"
          no_log: true

        - name: Encrypt the tempfile in place
          ansible.builtin.command:
            cmd: >-
              ansible-vault encrypt
              --vault-password-file {{ vault_pass_path | quote }}
              {{ vault_tmp.path | quote }}
          changed_when: true
          no_log: true

        - name: Atomically move encrypted tempfile into the inventory tree
          ansible.builtin.command:
            cmd: mv {{ vault_tmp.path | quote }} {{ vault_yml_path | quote }}
          changed_when: true
          no_log: true
      rescue:
        - name: Remove plaintext tempfile if an earlier step failed
          ansible.builtin.file:
            path: "{{ vault_tmp.path }}"
            state: absent
          when: vault_tmp is defined and vault_tmp.path is defined
          no_log: true

        - name: Re-raise the original failure
          ansible.builtin.fail:
            msg: >-
              Bootstrap failed while writing or encrypting the vault. Any
              plaintext tempfile has been removed.

    - name: Stat vars.yml
      ansible.builtin.stat:
        path: "{{ vars_yml_path }}"
      register: vars_yml_stat

    - name: Create vars.yml skeleton if absent
      ansible.builtin.copy:
        content: |
          ---
          # Stack-level overrides for the OpenNMS deployment.
          #
          # Database credentials (opennms_datasource_db_password, postgres_password) are
          # generated by indigo423.opennms.init_secrets and stored in the sibling vault.yml.
          # Rotate via: ansible-playbook -i <inventory> indigo423.opennms.init_secrets -e force_rotate=true
        dest: "{{ vars_yml_path }}"
        mode: "0644"
      when: not vars_yml_stat.stat.exists

    - name: Insert/update managed vault references in vars.yml
      ansible.builtin.blockinfile:
        path: "{{ vars_yml_path }}"
        marker_begin: "indigo423.opennms.init_secrets managed section >>>"
        marker_end: "indigo423.opennms.init_secrets managed section <<<"
        marker: "# {mark}"
        block: |
          opennms_datasource_db_password: "{% raw %}{{ vault_opennms_db_password }}{% endraw %}"
          postgres_password: "{% raw %}{{ vault_postgres_password }}{% endraw %}"
        mode: "0644"

    - name: Re-read vars.yml to verify managed section landed
      ansible.builtin.slurp:
        src: "{{ vars_yml_path }}"
      register: vars_yml_check

    - name: Assert managed vault references are present in vars.yml
      ansible.builtin.assert:
        that:
          - "'indigo423.opennms.init_secrets managed section >>>' in (vars_yml_check.content | b64decode)"
          - "'indigo423.opennms.init_secrets managed section <<<' in (vars_yml_check.content | b64decode)"
          - "'opennms_datasource_db_password' in (vars_yml_check.content | b64decode)"
          - "'postgres_password' in (vars_yml_check.content | b64decode)"
        fail_msg: >-
          blockinfile reported success but the managed section is not present
          in {{ vars_yml_path }}. The deployment playbook will fail with
          undefined vault variables. Inspect the file manually.

    - name: Print master-key warning and ansible.cfg instructions
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════════"
          - "Bootstrap complete."
          - ""
          - "Vault password file (MASTER KEY — back this up):"
          - "  {{ vault_pass_path }}"
          - ""
          - "Encrypted vault written to:"
          - "  {{ vault_yml_path }}"
          - ""
          - "Add this to your ansible.cfg, or set ANSIBLE_VAULT_PASSWORD_FILE:"
          - ""
          - "  [defaults]"
          - "  vault_password_file = {{ vault_pass_path }}"
          - ""
          - "Then commit the encrypted vault file:"
          - "  git add {{ vault_yml_path }} {{ vars_yml_path }}"
          - "  git commit"
          - ""
          - "⚠ If you lose the vault password file, the encrypted vault is"
          - "  unrecoverable. Back it up to a password manager or equivalent."
          - "════════════════════════════════════════════════════════════════════"
