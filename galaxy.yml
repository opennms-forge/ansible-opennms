---
namespace: indigo423
name: opennms
version: 0.8.0
readme: README.md
authors:
  - Ronny Trommer <ronny@no42.org>
description: >-
  Ansible collection for deploying OpenNMS Horizon monitoring infrastructure
  (Core, Minion, Sentinel) and supporting services (PostgreSQL, Kafka,
  Elasticsearch, Grafana, Mimir) on Debian/Ubuntu.
license:
  - GPL-3.0-or-later
tags:
  - opennms
  - monitoring
  - horizon
  - debian
  - ubuntu
  - linux
dependencies:
  community.postgresql: '>=4.2.0'
  community.general: '>=12.6.0'
  grafana.grafana: '>=6.1.0'
repository: https://github.com/opennms-forge/ansible-opennms
homepage: https://github.com/opennms-forge/ansible-opennms
issues: https://github.com/opennms-forge/ansible-opennms/issues
# Exclude test-bed scaffolding and project-internal docs from the published artifact.
# Roles are the consumable surface; playbooks/inventory at the repo root are a deployment harness.
build_ignore:
  - inventory
  - CLAUDE.md
  - RELEASING.md
  # Gitignored working directories. CI publishes from a clean checkout and never
  # sees these, but the manual-fallback publish in RELEASING.md runs from a
  # working tree — without these entries it ships local IDE/agent state, and
  # .ansible bundles a nested stale copy of this collection inside its own
  # artifact. A published Galaxy version cannot be withdrawn, so exclude at build.
  - .ansible          # local collection install root (collection install -r)
  - .claude           # agent config, incl. settings.local.json
  - .idea
  - '*.iml'
  - _bmad
  - _bmad-output
  - openspec
  - tests             # CI-only checks; not part of the published collection
  - Makefile          # local/CI entry points, not consumed by Galaxy installs
