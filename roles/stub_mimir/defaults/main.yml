---
mimir_version: 3.0.4
mimir_arch: amd64
mimir_pkg_url: "https://github.com/grafana/mimir/releases/download/mimir-{{ mimir_version }}/mimir-{{ mimir_version }}_{{ mimir_arch }}.deb"
mimir_http_port: 8080
mimir_data_dir: /var/lib/mimir

# Seconds systemd waits between restarts of mimir.service. The role's unit
# drop-in disables the start rate limit (see templates/systemd/override.conf.j2),
# so without this a failing Mimir would loop at systemd's 100ms default.
mimir_restart_sec: 5

# Bounds the wait for /ready after the service is started. A clustered node has
# to join memberlist and its ingester holds off for 15s after becoming ready, so
# the default allows a couple of minutes before failing the play.
mimir_startup_retries: 30
mimir_startup_delay: 5

# Per-tenant limits for the single anonymous tenant (multitenancy disabled).
# Mimir's defaults (ingestion_rate ~10k samples/s, max_global_series_per_user
# ~150k) throttle and 429 a large benchmark; raise them so a 10k-node OpenNMS
# remote_write load is measured un-throttled (0 = unlimited for the series caps).
mimir_ingestion_rate: 1000000
mimir_ingestion_burst_size: 2000000
mimir_max_global_series_per_user: 0
mimir_max_global_series_per_metric: 0

# Inventory group whose members form the cluster. One member keeps the
# single-node monolithic behaviour; more than one switches the rings to
# memberlist and scales replication.
mimir_cluster_group: mimir
mimir_memberlist_port: 7946

# Address each node advertises into the rings and to memberlist peers.
#
# Mimir's ring lifecycler picks its own address by detecting interfaces that
# carry a private (RFC 1918) address, falling back to the literal list
# [eth0, en0] when it finds none. A host addressed only out of a non-private
# range — 192.0.2.0/24, the documentation range the benchmark lab uses — gives
# the detection nothing, so the fallback runs, matches no predictable interface
# name, and Mimir dies with "no useable address found for interfaces
# [eth0 en0] / invalid ring lifecycler config".
#
# Measured, not assumed: on such a host, adding any RFC 1918 address (a
# docker0 at 172.17.0.1 is enough) makes Mimir start with no other change, and
# removing it again reproduces the failure. So the trigger is the absence of a
# private address, not the absence of eth0.
#
# This applies to single-node deployments too, however few rings they use: the
# ring lifecycler needs an address to register itself even when the KV store is
# in-memory. Verified on the lab's mimir-single bed with the role's own rendered
# config, so it is not a property of the package's shipped one (#158).
#
# An address, not a list of interface names: a name is a prediction about the
# host, an address is a fact about it, and a wrong prediction fails exactly the
# same way Mimir's own list does.
#
# Precedence, most specific first:
#
#   1. this variable, set directly
#   2. lab_mgmt_ip, from the benchmark lab's inventory
#   3. the host's default-route address
#
# lab_mgmt_ip keeps precedence over the derived value on purpose. The benchmark
# beds carry Mimir's peer traffic on the db subnet while the default route sits
# elsewhere, so the derived address would name the wrong NIC there. It is no
# longer the *only* source, though: it is defined in that lab's inventory and
# nowhere in this collection, so every other consumer used to fall through to
# an empty string — which silently disabled the addressing this variable exists
# to provide, clustered deployments included.
#
# Empty is not a supported state: the role asserts a value is available rather
# than rendering a config whose startup depends on interface detection.
#
# The `true` on each default is load-bearing. Jinja's default() falls through
# only on an *undefined* value, so an inventory carrying `lab_mgmt_ip: ""` as a
# placeholder would skip the derived address and fail the assert — with a
# message blaming gather_facts, which would be wrong. The boolean form treats
# empty as unset, which is what a placeholder means.
mimir_instance_addr: "{{ lab_mgmt_ip | default(ansible_default_ipv4.address | default('', true), true) }}"

# Shared object storage. Multi-node Mimir cannot use the filesystem backend:
# every component must see the same blocks, and a per-node directory is not a
# shared store. Set the endpoint to switch blocks/ruler/alertmanager storage to
# S3; left empty, storage stays on the filesystem (correct only for one node).
#
# Deliberately generic rather than naming a product. Mimir talks S3, so this
# works against AWS S3, MinIO, RustFS or anything else that does — the lab
# chooses the implementation, the role does not.
mimir_s3_endpoint: ""
mimir_s3_bucket_blocks: mimir-blocks
mimir_s3_bucket_ruler: mimir-ruler
mimir_s3_bucket_alertmanager: mimir-alertmanager
mimir_s3_access_key_id: ""
mimir_s3_secret_access_key: ""
# Lab object storage is typically plain HTTP on a private subnet.
mimir_s3_insecure: true
