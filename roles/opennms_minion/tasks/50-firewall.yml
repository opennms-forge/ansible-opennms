---
- name: Allow Minion listener ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ opennms_minion_firewall_ports }}"
  tags:
    - opennms
    - firewall
