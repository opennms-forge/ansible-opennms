---
# Installed only when profiling is actually configured, unlike Core. Core's
# launcher has a PYROSCOPE_AGENT_ENABLED branch, so a jar sitting on disk there
# is inert; Minion has no toggle of its own — loading the agent *is* enabling it.
# The populated dict is therefore the toggle, and an empty one skips the
# download rather than leaving 5 MB of unused jar on every Minion.
- name: Install the Pyroscope Java agent
  ansible.builtin.include_role:
    name: pyroscope_agent
  vars:
    pyroscope_agent_jar: "{{ opennms_minion_pyroscope_jar }}"
    pyroscope_agent_notify:
      - Restart minion
  when: opennms_minion_pyroscope | length > 0
  tags:
    - opennms
    - minion
    - pyroscope

# EXTRA_JAVA_OPTS, not JAVA_OPTS. Upstream's container.init sources this file and
# then does `EXTRA_JAVA_OPTS="$JAVA_OPTS $EXTRA_JAVA_OPTS"; unset JAVA_OPTS`, so
# either name reaches the Karaf JVM — but JAVA_OPTS is the operator knob the
# pristine file documents for heap and friends, and claiming it here would
# silently drop whatever they had set.
#
# No `export`, for the same reason the JAVA_HOME line omits it: systemd parses
# this file as an EnvironmentFile of KEY=value pairs. That is also what puts the
# PYROSCOPE_* keys into the JVM's environment, which is where the agent reads
# its own configuration from — it takes no command-line arguments.
#
# A block rather than one lineinfile per key, so that turning profiling back off
# removes the whole stanza in one step instead of leaving orphaned keys behind.
- name: Configure Pyroscope profiling for Minion
  ansible.builtin.blockinfile:
    path: /etc/default/minion
    marker: "# {mark} ANSIBLE MANAGED BLOCK: pyroscope"
    block: |
      EXTRA_JAVA_OPTS=-javaagent:{{ opennms_minion_pyroscope_jar }}
      {% for key, value in opennms_minion_pyroscope.items() %}
      {{ key }}={{ value }}
      {% endfor %}
    state: "{{ 'present' if opennms_minion_pyroscope | length > 0 else 'absent' }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart minion
  tags:
    - opennms
    - minion
    - pyroscope
    - configuration
