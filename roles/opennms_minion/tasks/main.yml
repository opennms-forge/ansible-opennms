---
# Every dynamic include below carries tags, and they are the union of the tags
# used inside the file or role it pulls in. That is load-bearing rather than
# decorative: a dynamic include is only entered when the include task itself
# matches the tag filter, so an untagged include makes every tag inside it
# unreachable — `--tags kafka` then selects nothing and reports success. Inner
# tasks keep being filtered by their own tags, so the union widens what can be
# reached, never what runs. Add a tag inside one of these files and add it here
# too.
# Transition guards for #170's variable scoping. Remove them a release or two
# after this ships, as the `opennms_repo_major` guard from #181 is.
#
# Both catch a value that would now be dropped in silence. That silence is the
# defect this change removes: a stale line keeps parsing, the run succeeds, and
# the pin the operator configured stops protecting anything.
- name: Fail when the removed shared pinning variables are still set
  ansible.builtin.assert:
    that:
      - opennms_pinned_packages is not defined
      - opennms_apt_preferences_file is not defined
      - opennms_unattended_blacklist_file is not defined
    fail_msg: >-
      This role no longer reads the shared pinning variables. Each of the three
      OpenNMS roles held a different value under the same name, so one entry in
      `group_vars` reached all of them: the package list replaced every role's
      list, and the two paths collapsed three files into one whose contents the
      last role to run decided. Use `opennms_minion_pinned_packages` for this
      role's list. The two file paths are no longer configurable, because a
      per-role path is what keeps the roles from overwriting each other.
    quiet: true
  tags:
    - always

- name: Verify the host clock is synchronised
  ansible.builtin.include_role:
    name: timesync
  tags:
    - timesync

- name: Include OpenNMS OpenJDK roles
  ansible.builtin.include_role:
    name: openjdk
  vars:
    openjdk_version: 21
    openjdk_pkg_version: "21*"
  tags:
    - java

# No `vars:` block. `opennms_repositories` derives its dist from
# `opennms_version`, which is this role's own variable and is already in scope
# here, so the caller's release reaches it without being restated. The
# repository role's fallback lives under a name of its own, so there is no
# second definition of `opennms_version` for load order to choose between, and
# `opennms_version: "{{ opennms_version }}"` could not be passed anyway: a
# self-referential include var raises "recursive loop detected in template".
#
# Scope is what makes this work through `opennms_icmp` as well, which includes
# the repository role again on its own account. A value passed on an
# `include_role` reaches that role and everything nested inside it but not a
# sibling include that follows, so the previous explicit pass reached the
# include below and not the one inside `opennms_icmp` — which then resolved a
# default that nothing kept current, and rewrote the source at the wrong major.
- name: Include OpenNMS repository roles
  ansible.builtin.include_role:
    name: opennms_repositories
  tags:
    - opennms
    - repository

- name: Include OpenNMS ICMP setup roles
  ansible.builtin.include_role:
    name: opennms_icmp
  tags:
    - icmp
    - opennms

# Written before the packages are installed, so a deliberate `opennms_version`
# bump rewrites the pin and permits the new version in the same run. Reversing
# these two would mean the old pin blocks the upgrade the run is trying to make.
- name: Pin OpenNMS packages to {{ opennms_version }}
  ansible.builtin.template:
    src: etc/apt-preferences-opennms.j2
    dest: "{{ _opennms_apt_preferences_file }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - opennms
    - packages

# Written next to the pin, and for the same reason: it must be in place before
# packages are installed so a run that bumps opennms_version is never racing a
# stale policy. Unconditional in the sense that matters -- no check for whether
# unattended-upgrades is installed. An apt.conf.d file declaring an option
# nothing reads is inert, so a guard would cost a fact-gathering round trip to
# decide something harmless either way.
- name: Blacklist OpenNMS packages from unattended-upgrades
  ansible.builtin.template:
    src: etc/apt-unattended-blacklist.j2
    dest: "{{ _opennms_unattended_blacklist_file }}"
    owner: root
    group: root
    mode: "0644"
  when: opennms_unattended_upgrade_blacklist | bool
  tags:
    - opennms
    - packages

# Turning the variable off must take the file with it. Skipping the template
# task alone would leave a host that was once blacklisted still blacklisted,
# so the operator's opt-out would silently do nothing.
- name: Remove the unattended-upgrades blacklist when disabled
  ansible.builtin.file:
    path: "{{ _opennms_unattended_blacklist_file }}"
    state: absent
  when: not opennms_unattended_upgrade_blacklist | bool
  tags:
    - opennms
    - packages

- name: Installing OpenNMS Minion {{ opennms_version }}
  ansible.builtin.apt:
    name: "opennms-minion={{ opennms_pkg_version }}"
    state: present
    install_recommends: false
  tags:
    - opennms
    - minion
    - package

- name: Resolve the installed JDK home
  ansible.builtin.command: readlink -f /usr/bin/java
  register: opennms_minion_java_bin
  changed_when: false
  tags:
    - opennms
    - minion

# The Minion service has no equivalent of Core's `runjava -s`; with JAVA_HOME
# unset, bin/minion falls back to bin/find-java.sh, which returns the *first*
# JDK it finds inside the range the launcher asks for — `17.0 21.9999` on
# Horizon 36. On a host carrying both 17 and 21 that is a coin toss, and it can
# hand Karaf a JDK other than the one the `openjdk` role installed for it.
# Pinning removes the guess: the JVM is the one this deployment chose.
#
# It is not needed to make Minion start. Measured on 36.0.4 with JDK 21: with
# this line deleted the service comes up on the right JVM anyway, find-java.sh
# resolving /usr/lib/jvm/java-21-openjdk-amd64 (noisily — it logs
# "unsure how to handle Java version output" while probing other candidates).
# An earlier version of this comment claimed find-java.sh's cap rejects 21 and
# aborts startup. That was true of an older Horizon, not of this one.
#
# No `export` — the file is parsed by systemd as KEY=value.
- name: Point the Minion service at the installed JDK
  ansible.builtin.lineinfile:
    path: /etc/default/minion
    regexp: '^#?\s*(export\s+)?JAVA_HOME='
    line: "JAVA_HOME={{ opennms_minion_java_bin.stdout | dirname | dirname }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart minion
  tags:
    - opennms
    - minion
    - configuration

- name: Configure Minion system properties
  ansible.builtin.template:
    src: custom.system.properties.j2
    dest: "{{ opennms_minion_home }}/etc/custom.system.properties"
    owner: minion
    group: minion
    mode: "0640"
  with_dict: "{{ opennms_minion_customer_system_properties | default([]) }}"
  notify:
    - Restart minion
  tags:
    - opennms
    - minion
    - configuration

# TODO: We need to run the specific role depending on the message broker
- name: Configure Kafka as message broker
  ansible.builtin.include_tasks: 21-kafka.yml
  tags:
    - configuration
    - kafka
    - minion
    - opennms

- name: Configure Pyroscope continuous profiling
  ansible.builtin.include_tasks: 30-pyroscope.yml
  tags:
    - opennms
    - minion
    - pyroscope
    - configuration

- name: Enable systemd unit for OpenNMS Minion
  ansible.builtin.service:
    name: minion.service
    enabled: true
  tags:
    - opennms
    - minion
    - systemd

- name: Start systemd unit for OpenNMS Minion
  ansible.builtin.service:
    name: minion.service
    state: started
  when:
    - skip_minion_startup | default("false") == "false"
  tags:
    - opennms
    - minion
    - systemd
