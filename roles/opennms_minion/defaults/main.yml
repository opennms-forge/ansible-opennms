---
opennms_distribution: Horizon
# renovate: datasource=github-tags depName=OpenNMS/opennms extractVersion=^opennms-(?<version>\d+\.\d+\.\d+)-\d+$
opennms_version: 36.0.3
opennms_pkg_version: "{{ opennms_version }}*"
opennms_minion_home: "/opt/minion"

opennms_minion_controller:
  id: "{{ ansible_facts['machine_id'] if ansible_facts['machine_id'] is defined else inventory_hostname }}"
  location: ANSIBLE_UNSET_MINION_LOCATION

# Common Kafka IPC configuration, rendered to org.opennms.core.ipc.kafka.cfg.
# Used by the sink, rpc and twin modules unless a module below overrides it.
opennms_minion_kafka:
  "bootstrap.servers": localhost:9092

# Per-module Kafka configuration, for pointing sink, rpc or twin at different
# brokers. Each renders its own Karaf PID file, and each is written only when
# non-empty — leaving one empty keeps that module on the common config above.
#
# These are COMPLETE configurations, not deltas. OpenNMS selects a whole file:
# `OsgiKafkaConfigProvider` uses the module PID in full if its properties contain
# `bootstrap.servers`, and otherwise ignores the file entirely and falls back to
# the common PID. There is no key-level merge, despite the upstream docs saying
# module values "take precedence". A module file without `bootstrap.servers`
# does nothing at all, so the role refuses to render one.
#
#   opennms_minion_kafka_sink:
#     "bootstrap.servers": sink-kafka.example.org:9092   # required, not optional
#     "group.id": HQ-Minion-Sink
opennms_minion_kafka_sink: {}
opennms_minion_kafka_rpc: {}
opennms_minion_kafka_twin: {}

# Maps each module variable to the Karaf PID whose .cfg file it renders. The PID
# is the filename, which is why module settings cannot live as prefixed keys
# inside the common file. Verified against the blueprints on opennms-36.0.3-1:
# sink, rpc and twin each construct OsgiKafkaConfigProvider(<module pid>,
# configAdmin, org.opennms.core.ipc.kafka).
_opennms_minion_kafka_modules:
  - var: opennms_minion_kafka_sink
    pid: org.opennms.core.ipc.sink.kafka
    properties: "{{ opennms_minion_kafka_sink }}"
  - var: opennms_minion_kafka_rpc
    pid: org.opennms.core.ipc.rpc.kafka
    properties: "{{ opennms_minion_kafka_rpc }}"
  - var: opennms_minion_kafka_twin
    pid: org.opennms.core.ipc.twin.kafka
    properties: "{{ opennms_minion_kafka_twin }}"

# OpenNMS packages pinned by the APT preferences file this role writes, so a
# routine `apt upgrade` cannot move them. System packages (rrdtool, jrrd2,
# iplike) are deliberately excluded — they should still receive security fixes.
opennms_pinned_packages:
  - opennms-minion
opennms_apt_preferences_file: /etc/apt/preferences.d/99-opennms-minion.pref

# The `Origin:` field the repository publishes, which the pin's exclusion tier
# keys on. Not a hostname: `Pin: origin <host>` matches the site, so keying on
# the URL would silently disable the tier for anyone pointing
# `opennms_repo_url` at a mirror. See the template for the full reasoning.
#
# The same-major tier needs no variable at all — it is a version glob derived
# from `opennms_version`, so it cannot diverge from the dist the source line
# points at the way a Codename-keyed pin could.
opennms_pin_origin: OpenNMS

# Removes the pinned packages from `unattended-upgrades` consideration. On by
# default, because the preferences file cannot express "prefer exactly this
# version, and if it is gone, do nothing": two of its tiers admit a version an
# unattended host will move to with nobody watching. Tier 1 matches any Debian
# revision of the configured release, so a reissued `-2` moves and restarts the
# service on a day nothing here changed. Tier 2 admits a newer patch once the
# configured version leaves the repository. Both measured, not assumed.
#
# Opt-out rather than opt-in: a control that stays off until someone reads a
# README is off, and the pin itself is not opt-in. Setting this false accepts
# both moves. It does not affect the cross-major protection, which is the
# preferences file's -1 tier.
opennms_unattended_upgrade_blacklist: true

# One file per role. APT accumulates list entries across apt.conf.d rather than
# letting the last definition win, so a single-host stack running several
# OpenNMS roles gets the union of their packages. A shared filename would mean
# whichever role ran last decided the contents.
opennms_unattended_blacklist_file: /etc/apt/apt.conf.d/51-opennms-minion-blacklist
