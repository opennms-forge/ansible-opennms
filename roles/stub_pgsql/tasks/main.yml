---
- name: Verify Ansible version
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.11.0', '>=', version_type='semver')
    fail_msg: "You need at least Ansible 2.11 or greater to run these tasks. Your Ansible version is {{ ansible_version.full }}."
  tags:
    - dependency
    - ansible

- name: Verify credentials before anything else
  ansible.builtin.include_tasks: 00-credentials-check.yml

- name: Refuse an unsupported platform
  ansible.builtin.include_tasks: assert-platform.yml
  tags:
    - always

- name: Load the PostgreSQL layout for {{ ansible_facts['os_family'] }}
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags:
    - always

- name: Include OpenNMS repository roles
  ansible.builtin.include_role:
    name: opennms_repositories

# Private scratch space for the key material; see the same note in
# opennms_repositories for why a fixed /tmp path is not good enough.
#
# Created outside the block below so the `always` can still reference its path.
- name: Create a private working directory for PostgreSQL key material
  ansible.builtin.tempfile:
    state: directory
    suffix: pgsql-repo-key
  register: pgsql_key_workdir
  changed_when: false
  check_mode: false
  tags:
    - opennms
    - postgresql
    - repository

# Everything that touches the working directory sits in this block so `always`
# removes it even when verification fails. A plain cleanup task after the
# asserts only runs on success, so a rejected key left its directory behind and
# repeated failures — exactly what happens while working through a key
# rotation — accumulated them.
- name: Verify and install the PostgreSQL repository key
  tags:
    - opennms
    - postgresql
    - repository
  block:
    - name: Download PostgreSQL repository key
      ansible.builtin.get_url:
        url: "{{ _pgsql_key_url }}"
        dest: "{{ pgsql_key_workdir.path }}/gpg.ACCC4CF8.key"
        mode: "0600"
        # Always re-fetch; see the same note in opennms_repositories.
        force: true
        checksum: "{{ ('sha256:' ~ _pgsql_key_sha256) if _pgsql_key_sha256 else omit }}"
      changed_when: false
      check_mode: false

    # Dearmored to a private temp path, not straight into the keyring directory,
    # so the fingerprint check below runs before anything reaches a trusted
    # location.
    - name: Convert the PostgreSQL repository key to GPG format
      ansible.builtin.command: >-
        gpg --batch --yes --dearmor
        -o {{ pgsql_key_workdir.path }}/pgsql-repo-keyring.gpg
        {{ pgsql_key_workdir.path }}/gpg.ACCC4CF8.key
      changed_when: false
      check_mode: false

    - name: Read the fingerprints of the PostgreSQL repository key
      ansible.builtin.command: "gpg --show-keys --with-colons {{ pgsql_key_workdir.path }}/pgsql-repo-keyring.gpg"
      register: pgsql_key_show
      changed_when: false
      check_mode: false

    - name: Fail when no fingerprint can be read from the PostgreSQL repository key
      ansible.builtin.assert:
        that:
          - pgsql_key_show.stdout_lines | select('match', '^fpr:') | list | length > 0
        fail_msg: >-
          No OpenPGP fingerprint could be read from {{ _pgsql_key_url }}.
          The downloaded file is not a usable public key, so its identity cannot
          be established. Refusing to install it.
        quiet: true

    - name: Fail when the accepted PostgreSQL fingerprints are not a list
      ansible.builtin.assert:
        that:
          - _pgsql_key_fingerprints is not string
          - _pgsql_key_fingerprints is sequence
        fail_msg: >-
          `{{ _pgsql_key_fingerprints_var }}` must be a list, but it is
          {{ _pgsql_key_fingerprints | type_debug }}. A bare string makes the
          comparison iterate characters instead of fingerprints, so the mismatch
          message below would be unreadable. Wrap the value in a list.
        quiet: true

    - name: Verify the PostgreSQL repository key matches an accepted fingerprint
      vars:
        # First `fpr:` record is the primary key; later ones are subkeys.
        pgsql_key_fpr_found: "{{ (pgsql_key_show.stdout_lines | select('match', '^fpr:') | first).split(':')[9] | upper }}"
        pgsql_key_fpr_accepted: "{{ _pgsql_key_fingerprints | map('replace', ' ', '') | map('upper') | list }}"
      ansible.builtin.assert:
        that:
          - pgsql_key_fpr_found in pgsql_key_fpr_accepted
        fail_msg: >-
          The key served by {{ _pgsql_key_url }} has fingerprint
          {{ pgsql_key_fpr_found }}, which is not accepted.
          Expected one of: {{ pgsql_key_fpr_accepted | join(', ') }}.
          Refusing to install it. If PostgreSQL has rotated its signing key,
          verify the new fingerprint out-of-band and add it to
          `{{ _pgsql_key_fingerprints_var }}`.
        quiet: true

    - name: Install PostgreSQL repository keyring
      ansible.builtin.copy:
        src: "{{ pgsql_key_workdir.path }}/pgsql-repo-keyring.gpg"
        dest: "{{ pgsql_key_ring_file }}"
        mode: "0644"
        remote_src: true
      when: ansible_facts['os_family'] == 'Debian'

    # rpm imports armored keys; see opennms_repositories for why the download
    # is the same key the fingerprint check read.
    - name: Install PostgreSQL repository key for RPM
      ansible.builtin.copy:
        src: "{{ pgsql_key_workdir.path }}/gpg.ACCC4CF8.key"
        dest: "{{ pgsql_rpm_key_file }}"
        mode: "0644"
        remote_src: true
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Import PostgreSQL repository key into the RPM database
      ansible.builtin.rpm_key:
        key: "{{ pgsql_rpm_key_file }}"
        # The one fingerprint the check above matched. rpm_key reads a list as
        # "every one of these", so passing the accepted list would fail as soon
        # as a rollover adds a second entry.
        fingerprint: "{{ (pgsql_key_show.stdout_lines | select('match', '^fpr:') | first).split(':')[9] }}"
        state: present
      when: ansible_facts['os_family'] == 'RedHat'
  always:
    # Guarded so a missing path cannot raise inside `always` and mask the real
    # failure that brought us here.
    - name: Remove the private working directory for PostgreSQL key material
      ansible.builtin.file:
        path: "{{ pgsql_key_workdir.path }}"
        state: absent
      when: pgsql_key_workdir.path is defined
      changed_when: false
      check_mode: false

- name: Add the PostgreSQL package source
  ansible.builtin.include_tasks: "repository-{{ ansible_facts['os_family'] }}.yml"
  tags:
    - opennms
    - postgresql
    - repository

- name: Install PostgreSQL Server {{ pg_version }}
  ansible.builtin.include_tasks: "install-{{ ansible_facts['os_family'] }}.yml"
  tags:
    - opennms
    - postgresql

- name: Configure PostgreSQL Server interface listening
  ansible.builtin.lineinfile:
    path: "{{ _pgsql_conf_dir }}/postgresql.conf"
    search_string: "#listen_addresses = 'localhost'"
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
  notify:
    - Restart postgresql
  tags:
    - opennms
    - postgresql

- name: Configure PostgreSQL authentication and access
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ _pgsql_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify:
    - Restart postgresql
  tags:
    - opennms
    - postgresql

- name: Enable and start systemd unit for PostgreSQL
  ansible.builtin.service:
    name: "{{ _pgsql_service }}"
    enabled: true
    state: started
  tags:
    - opennms
    - postgresql
    - systemd

- name: Install python3-psycopg2 dependency for PostgreSQL community module
  ansible.builtin.package:
    name: python3-psycopg2
    state: present
  tags:
    - opennms
    - postgresql
    - ansible

# OpenNMS publishes no iplike for PostgreSQL 18 on EL 10. There the OpenNMS
# installer finds no usable C function and installs its PL/pgSQL iplike, which
# is slower for IP-range filters but answers the same queries.
- name: Install OpenNMS iplike store package
  ansible.builtin.apt:
    name: iplike-pgsql{{ pg_version }}
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - opennms
    - postgresql

- name: Set SCRAM-SHA-256 password encryption
  become: true
  become_user: postgres
  community.postgresql.postgresql_alter_system:
    param: password_encryption
    value: scram-sha-256
  notify:
    - Restart postgresql
  tags:
    - opennms
    - postgresql
    - initialize
    - credentials

- name: Set postgres admin password
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_db: postgres
    query: "ALTER USER {{ postgres_user }} WITH PASSWORD '{{ postgres_password }}';"
  no_log: true
  tags:
    - opennms
    - postgresql
    - initialize
    - credentials

- name: Create OpenNMS database user {{ opennms_datasource_db_user }}
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    state: present
    name: "{{ opennms_datasource_db_user }}"
    password: "{{ opennms_datasource_db_password }}"
  tags:
    - opennms
    - postgresql
    - initialize
    - database

- name: Create OpenNMS database {{ opennms_datasource_db_name }}
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ opennms_datasource_db_name }}"
    owner: "{{ opennms_datasource_db_user }}"
  tags:
    - opennms
    - postgresql
    - initialize
    - database

- name: Install iplike stored procedure in OpenNMS database
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_db: "{{ opennms_datasource_db_name }}"
    # yamllint disable-line rule:line-length
    query: "CREATE OR REPLACE FUNCTION iplike(i_ipaddress text,i_rule text) RETURNS bool AS '/usr/lib/postgresql/{{ pg_version }}/lib/iplike.so' LANGUAGE 'c' RETURNS NULL ON NULL INPUT;"
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - opennms
    - postgresql
    - iplike
    - credentials
