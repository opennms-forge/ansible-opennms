---
- name: Verify PostgreSQL credentials are configured
  ansible.builtin.assert:
    that:
      - postgres_password is defined
      - postgres_password != "__SET_VIA_VAULT__"
      - postgres_password | length >= 12
      - opennms_datasource_db_password is defined
      - opennms_datasource_db_password != "__SET_VIA_VAULT__"
      - opennms_datasource_db_password | length >= 12
    fail_msg: >-
      PostgreSQL credentials are not configured. Run:
        ansible-playbook -i <your inventory> indigo423.opennms.init_secrets
      Or override postgres_password and opennms_datasource_db_password via your
      inventory. See the collection README for details.
  no_log: true
  tags:
    - always
