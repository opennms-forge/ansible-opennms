---
- name: Add PostgreSQL repo to yum repositories
  ansible.builtin.template:
    src: pgdg.repo.j2
    dest: /etc/yum.repos.d/pgdg.repo
    owner: root
    group: root
    mode: "0644"
  tags:
    - opennms
    - postgresql
    - repository
