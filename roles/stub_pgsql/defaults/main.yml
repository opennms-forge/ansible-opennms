---
pgsql_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc

# Accepted signing-key fingerprints, the authoritative trust control.
# See roles/opennms_repositories/README.md for why the fingerprint is pinned
# rather than the key file's hash.
pgsql_key_fingerprints:
  - "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"

# Optional file-hash pin, off by default. See opennms_key_sha256.
pgsql_key_sha256: null

pgsql_key_ring_file: /usr/share/keyrings/pgsql-keyring.gpg
pgsql_repo_url: https://apt.postgresql.org/pub/repos/apt
arch: amd64
# Just the major version for PostgreSQL, used also for iplike installation and setup
pg_version: 18
pg_pkg_version: "{{ pg_version }}.*"

postgres_user: postgres
# postgres_password is intentionally sentinel-defaulted: the role refuses to
# run with this value (see tasks/00-credentials-check.yml). Provide a real
# value via the vault populated by indigo423.opennms.init_secrets, or override
# directly in your inventory.
postgres_password: "__SET_VIA_VAULT__"
postgres_listen_addresses: localhost
postgres_hba_permissions_v4: 127.0.0.1/32
postgres_hba_permissions_v6: ::1/128
postgres_hba_auth_method: scram-sha-256

opennms_datasource_db_user: opennms
# See note above; same sentinel + bootstrap workflow applies.
opennms_datasource_db_password: "__SET_VIA_VAULT__"
opennms_datasource_db_name: opennms_horizon
