---
# The Prometheus JMX exporter Java agent, pinned once for Core, Minion and
# Sentinel. Moved here from opennms_core's defaults under the same names, so an
# inventory that overrode them keeps working.
#
# renovate: datasource=github-releases depName=prometheus/jmx_exporter extractVersion=^v?(?<version>.+)$
prom_jmx_exporter_version: 1.7.0
# The release path carries NO "v" prefix. Upstream does have a stray `v1.6.0`
# git tag, but no release is attached to it, and download URLs resolve against
# the release's tag_name, which is bare for every 1.x release. Reading the tag
# list and concluding otherwise is what broke this before (issue #135).
prom_jmx_exporter_url: "https://github.com/prometheus/jmx_exporter/releases/download/{{ prom_jmx_exporter_version }}/jmx_prometheus_javaagent-{{ prom_jmx_exporter_version }}.jar"
prom_jmx_exporter_sha256: sha256:0ad843261c567d1924a017d542e14c40f2afff523d940c25ee000742fde4b3a9

# Rendered into the exporter's YAML config. One config serves all three
# components: a bean pattern that matches nothing on a component exports
# nothing there.
prom_jmx_exporter_config:
  start_delay_seconds: 0
  lowercase_output_name: true
  lowercase_output_label_names: true
  auto_exclude_object_name_attributes: true
  include_object_names:
    - "java.lang:*"
    - "OpenNMS:*"
    - "org.opennms.*:*"
    - "org.opennms.newts:name=ring-buffer*"
    - "org.opennms.newts:name=repository.samples-inserted*"
    - "org.opennms.core.ipc.rpc:*"
    - "com.zaxxer.hikari:*"

# Absolute paths of the jar and its config. No defaults: the component role
# owns the paths, because it also writes them into the JVM options. The role
# asserts instead of guessing.
prom_jmx_exporter_jar: ""
prom_jmx_exporter_config_file: ""

# Handlers the caller wants fired when the jar or config changes. The agent
# reads both at JVM startup, so a change does nothing until the component
# restarts, and which service that is belongs to the component role.
prom_jmx_exporter_notify: []
