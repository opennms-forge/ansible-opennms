---
argument_specs:
  main:
    short_description: Installs the pinned Prometheus JMX exporter Java agent.
    description:
      - Downloads and verifies the JMX exporter jar and renders its config at
        paths chosen by the calling role.
      - Does no JVM wiring and knows nothing about services. Loading the agent
        is the calling role's job.
    options:
      prom_jmx_exporter_version:
        type: str
        default: "1.7.0"
        description:
          - JMX exporter release to install.
          - Bumping this requires a matching C(prom_jmx_exporter_sha256).
      prom_jmx_exporter_url:
        type: str
        description:
          - Download URL for the agent jar. Defaults to the GitHub release asset
            for C(prom_jmx_exporter_version).
      prom_jmx_exporter_sha256:
        type: str
        description:
          - Checksum of the jar, in the C(sha256:<digest>) form the
            M(ansible.builtin.get_url) C(checksum) option expects.
      prom_jmx_exporter_config:
        type: dict
        description:
          - Settings rendered into the exporter config. Keys are
            C(start_delay_seconds), C(lowercase_output_name),
            C(lowercase_output_label_names),
            C(auto_exclude_object_name_attributes) and
            C(include_object_names).
      prom_jmx_exporter_jar:
        type: str
        required: false
        default: ""
        description:
          - Absolute path to install the jar to, including the filename.
          - Required in practice. The role asserts on it.
      prom_jmx_exporter_config_file:
        type: str
        required: false
        default: ""
        description:
          - Absolute path to render the config to, including the filename.
          - Required in practice. The role asserts on it.
      prom_jmx_exporter_notify:
        type: list
        elements: str
        default: []
        description:
          - Handlers to notify when the jar or config changes, so the calling
            role can restart its own component.
