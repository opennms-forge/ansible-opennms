---
- name: Add Elasticsearch repo to yum repositories
  ansible.builtin.template:
    src: elasticsearch.repo.j2
    dest: /etc/yum.repos.d/elasticsearch.repo
    owner: root
    group: root
    mode: "0644"
  tags:
    - elasticsearch
    - repository
