---
es_key_url: https://artifacts.elastic.co/GPG-KEY-elasticsearch

# Accepted signing-key fingerprints. This is the authoritative trust control:
# a fingerprint is the key's identity, so it survives re-exports that change
# the key *file*'s bytes without changing the key. A list, not a scalar, so a
# rollover is an append rather than a swap — which matters more here than for
# the OpenNMS key, since this one is RSA-2048 from 2013.
# See README.md for the provenance of the pinned value.
es_key_fingerprints:
  - "46095ACC8548582C1A2699A9D27D666CD88E42B4"

# Optional file-hash pin, off by default. Pinning the bytes of a live-served
# key file breaks on harmless re-exports (see issue #139), so no default ships.
es_key_sha256: null

es_key_ring_file: /usr/share/keyrings/elasticsearch-keyring.gpg
es_repo_url: https://artifacts.elastic.co/packages/8.x/apt
arch: amd64
es_version: 8.18.2
drift_version: 2.0.7
es_pkg_version: "{{ es_version }}*"
# Declared here rather than inline in the task so the download-URL check covers
# it. Its release tag is a compound of both versions (`v2.0.7_es-8.18.2`), which
# is exactly the shape that silently 404s when one of them moves.
es_drift_plugin_url: "https://github.com/OpenNMS/elasticsearch-drift-plugin/releases/download/v{{ drift_version }}_es-{{ es_version }}/elasticsearch-drift-plugin-{{ es_version }}-{{ drift_version }}.zip"
onms_drift_plugin_dir: /usr/share/elasticsearch/plugins/drift
es_etc_dir: /etc/elasticsearch
# Inventory group whose members form the cluster. One member -> single-node
# discovery; more than one -> seed hosts and initial master nodes are derived
# from it, so scaling the group is the only change needed.
es_cluster_group: elasticsearch

# Discovery keys are NOT set here — the role computes them from es_cluster_group
# (see vars/main.yml) and merges them over this dict. Setting discovery.type or
# discovery.seed_hosts here would be overridden.
es_configuration:
  action.destructive_requires_name: true
  bootstrap.memory_lock: true
  cluster.max_shards_per_node: 6000
  cluster.name: opennms-flows
  http.port: 9200
  network.host: 0.0.0.0
  node.attr.rack: r1
  node.name: "{{ ansible_hostname }}"
  node.roles: '[master, data, ingest]'
  search.max_buckets: 50000
  path.data: /var/lib/elasticsearch
  path.logs: /var/log/elasticsearch
  xpack.security.enabled: 'false'
  xpack.security.http.ssl.enabled: 'false'
  xpack.security.transport.ssl.enabled: 'false'
es_jvm_options: {}
