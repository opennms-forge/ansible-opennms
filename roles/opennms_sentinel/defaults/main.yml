---
opennms_distribution: Horizon
# renovate: datasource=github-tags depName=OpenNMS/opennms extractVersion=^opennms-(?<version>\d+\.\d+\.\d+)-\d+$
opennms_version: 36.0.3
opennms_pkg_version: "{{ opennms_version }}*"
opennms_sentinel_home: /opt/sentinel

opennms_datasource_db_host: localhost
opennms_datasource_db_port: 5432
opennms_datasource_db_name: opennms_horizon
opennms_datasource_db_user: opennms

# opennms_datasource_db_password is intentionally sentinel-defaulted: the role
# refuses to run with this value (see tasks/00-credentials-check.yml). Provide
# a real value via the vault populated by indigo423.opennms.init_secrets, or
# override directly in your inventory.
opennms_datasource_db_password: "__SET_VIA_VAULT__"

opennms_sentinel_distributed_datasource:
  "datasource.url": "jdbc:postgresql://{{ opennms_datasource_db_host }}:{{ opennms_datasource_db_port }}/{{ opennms_datasource_db_name }}"
  "datasource.username": "{{ opennms_datasource_db_user }}"
  "datasource.password": "{{ opennms_datasource_db_password }}"
  "datasource.databaseName": "{{ opennms_datasource_db_name }}"

# Elasticsearch flow persistence - disabled by default.
# Populate this dict to enable flow persistence on Sentinel.
# Do NOT also enable opennms_elastic_flows on Core when Sentinel handles flows.
# See inventory/group_vars/opennms_stack/vars.yml for all available properties and examples.
opennms_elastic_flows: {}

opennms_sentinel_controller:
  id: "{{ ansible_facts['machine_id'] if ansible_facts['machine_id'] is defined else inventory_hostname }}"
  location: ANSIBLE_UNSET_SENTINEL_LOCATION

# Inventory group holding the Kafka brokers, used to default
# bootstrap.servers below. Empty or absent falls back to localhost:9092.
sentinel_kafka_group: message_broker
sentinel_kafka_port: 9092

opennms_sentinel_kafka:
  # Defaulted from sentinel_kafka_group rather than hard-coded: Sentinel and
  # Kafka are separate nodes in every topology that runs a Sentinel, so
  # localhost:9092 is never right there. Being a default, an operator-supplied
  # opennms_sentinel_kafka still wins outright.
  "bootstrap.servers": "{{ _sentinel_bootstrap_servers }}"
  # One shared group is what makes several Sentinels split the flow workload:
  # Kafka assigns partitions across the consumers in a group, so instances
  # divide the load rather than each processing every record. Giving them
  # distinct group ids would duplicate the work instead.
  "group.id": OpenNMS

# OpenNMS packages pinned by the APT preferences file this role writes, so a
# routine `apt upgrade` cannot move them. System packages (rrdtool, jrrd2,
# iplike) are deliberately excluded — they should still receive security fixes.
opennms_pinned_packages:
  - opennms-sentinel
opennms_apt_preferences_file: /etc/apt/preferences.d/99-opennms-sentinel.pref

# The `Origin:` field the repository publishes, which the pin's exclusion tier
# keys on. Not a hostname: `Pin: origin <host>` matches the site, so keying on
# the URL would silently disable the tier for anyone pointing
# `opennms_repo_url` at a mirror. See the template for the full reasoning.
#
# The same-major tier needs no variable at all — it is a version glob derived
# from `opennms_version`, so it cannot diverge from the dist the source line
# points at the way a Codename-keyed pin could.
opennms_pin_origin: OpenNMS
