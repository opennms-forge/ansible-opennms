---
# Installed only when a port is set. The same variable decides whether the
# block below loads the agent, so the jar and the JVM option cannot disagree.
- name: Install the JMX Prometheus exporter
  ansible.builtin.include_role:
    name: prom_jmx_exporter
  vars:
    prom_jmx_exporter_jar: "{{ _opennms_sentinel_jmx_exporter_jar }}"
    prom_jmx_exporter_config_file: "{{ _opennms_sentinel_jmx_exporter_config_file }}"
    prom_jmx_exporter_notify:
      - Restart sentinel
  when: opennms_sentinel_jmx_exporter_port | int > 0
  tags:
    - opennms
    - sentinel
    - jmx-prometheus-exporter

# Same guard as the Pyroscope block: blockinfile fails on a missing file
# whatever the state, and with nothing to load a missing file is fine.
- name: Check whether the Sentinel sysconfig file exists
  ansible.builtin.stat:
    path: "{{ _opennms_sentinel_sysconfig_file }}"
  register: opennms_sentinel_agents_sysconfig
  tags:
    - opennms
    - sentinel
    - jmx-prometheus-exporter
    - pyroscope
    - configuration

# EXTRA_JAVA_OPTS, not JAVA_OPTS. Upstream's container.init sources this file and
# then does `EXTRA_JAVA_OPTS="$JAVA_OPTS $EXTRA_JAVA_OPTS"; unset JAVA_OPTS`, so
# either name reaches the Karaf JVM — but JAVA_OPTS is the operator knob the
# pristine file documents for heap and friends, and claiming it here would
# silently drop whatever they had set.
#
# One block for every agent, because systemd keeps only the last
# EXTRA_JAVA_OPTS assignment in this file and expands no $EXTRA_JAVA_OPTS. It
# is absent when no agent is enabled, so turning the last one off removes the
# JVM option. The body comes from a template so tests/render/ can check it.
- name: Load the enabled Java agents into the Sentinel JVM
  ansible.builtin.blockinfile:
    path: "{{ _opennms_sentinel_sysconfig_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: java-agents"
    block: "{{ lookup('template', 'java-agents-env.j2') }}"
    state: "{{ 'present' if _opennms_sentinel_java_agents | length > 0 else 'absent' }}"
    owner: root
    group: root
    mode: "0644"
  when: _opennms_sentinel_java_agents | length > 0 or opennms_sentinel_agents_sysconfig.stat.exists
  notify:
    - Restart sentinel
  tags:
    - opennms
    - sentinel
    - jmx-prometheus-exporter
    - pyroscope
    - configuration
