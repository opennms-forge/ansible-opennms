---
- name: Verify Sentinel database credentials are configured
  ansible.builtin.assert:
    that:
      - opennms_datasource_db_password is defined
      - opennms_datasource_db_password != "__SET_VIA_VAULT__"
      - opennms_datasource_db_password | length >= 12
    fail_msg: >-
      Sentinel database credentials are not configured. Run:
        ansible-playbook -i <your inventory> indigo423.opennms.init_secrets
      Or override opennms_datasource_db_password via your inventory. See the
      collection README for details.
  no_log: true
  tags:
    - always
