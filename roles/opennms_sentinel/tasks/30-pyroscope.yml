---
# Installed only when profiling is actually configured, unlike Core. Core's
# launcher has a PYROSCOPE_AGENT_ENABLED branch, so a jar sitting on disk there
# is inert; Sentinel has no toggle of its own — loading the agent *is* enabling
# it. The populated dict is therefore the toggle, and an empty one skips the
# download rather than leaving 5 MB of unused jar on every Sentinel.
- name: Install the Pyroscope Java agent
  ansible.builtin.include_role:
    name: pyroscope_agent
  vars:
    pyroscope_agent_jar: "{{ opennms_sentinel_pyroscope_jar }}"
    pyroscope_agent_notify:
      - Restart sentinel
  when: opennms_sentinel_pyroscope | length > 0
  tags:
    - opennms
    - sentinel
    - pyroscope

- name: Verify no Pyroscope value carries a single quote
  ansible.builtin.assert:
    that:
      - opennms_sentinel_pyroscope.values() | map('string') | select('search', "'") | list | length == 0
    fail_msg: >-
      A value in `opennms_sentinel_pyroscope` contains a single quote. The keys
      are written single-quoted into /etc/default/sentinel, which both systemd
      and the shell that sources it read literally, and a single quote cannot be
      escaped inside them. Remove it or express the value another way.
    quiet: true
  when: opennms_sentinel_pyroscope | length > 0
  tags:
    - opennms
    - sentinel
    - pyroscope
    - configuration

# EXTRA_JAVA_OPTS, not JAVA_OPTS. Upstream's container.init sources this file and
# then does `EXTRA_JAVA_OPTS="$JAVA_OPTS $EXTRA_JAVA_OPTS"; unset JAVA_OPTS`, so
# either name reaches the Karaf JVM — but JAVA_OPTS is the operator knob the
# pristine file documents for heap and friends, and claiming it here would
# silently drop whatever they had set.
#
# No `export`: systemd parses this file as an EnvironmentFile of KEY=value pairs,
# and that is also what puts the PYROSCOPE_* keys into the JVM's environment,
# which is where the agent reads its own configuration from — it takes no
# command-line arguments.
#
# A block rather than one lineinfile per key, so that turning profiling back off
# removes the whole stanza in one step instead of leaving orphaned keys behind.
#
# The block's body comes from a template rather than being written inline here,
# which is what lets tests/render/ check the rendering without a host. Its
# quoting is the thing worth checking: two defects in this stanza shipped past
# ansible-lint, and both were found by reading rendered output. The template
# carries the reasoning.
#
# `lookup('template', ...)` renders on the controller, which is where blockinfile
# templates its `block` argument anyway — so this is the same work, moved
# somewhere it can be inspected. Verified byte-identical to the previous inline
# form, including a JSON value and one carrying `$` and embedded quotes.
#
# The file is not created here, because the package always ships it: debian/rules
# renames the pristine sentinel.conf to $SYSCONFDIR/sentinel with SYSCONFDIR set
# to /etc/default. Removal is skipped when it is missing all the same:
# blockinfile fails on an absent path whatever the requested state, and a
# disabled feature must not be what breaks the play on a host that installed
# Sentinel some other way.
- name: Check whether the Sentinel sysconfig file exists
  ansible.builtin.stat:
    path: /etc/default/sentinel
  register: opennms_sentinel_sysconfig
  tags:
    - opennms
    - sentinel
    - pyroscope
    - configuration

- name: Configure Pyroscope profiling for Sentinel
  ansible.builtin.blockinfile:
    path: /etc/default/sentinel
    marker: "# {mark} ANSIBLE MANAGED BLOCK: pyroscope"
    block: "{{ lookup('template', 'pyroscope-env.j2') }}"
    state: "{{ 'present' if opennms_sentinel_pyroscope | length > 0 else 'absent' }}"
    owner: root
    group: root
    mode: "0644"
  when: opennms_sentinel_pyroscope | length > 0 or opennms_sentinel_sysconfig.stat.exists
  notify:
    - Restart sentinel
  tags:
    - opennms
    - sentinel
    - pyroscope
    - configuration
