# The RPM ships it, and bin/sentinel sources it (SYSCONFDIR=/etc/sysconfig). The
# unit's own EnvironmentFile points elsewhere, so systemd does not read this one.
_opennms_sentinel_sysconfig_file: /etc/sysconfig/sentinel
