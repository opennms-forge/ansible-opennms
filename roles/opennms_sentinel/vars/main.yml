---
# Brokers in a stable order, so every Sentinel renders the same bootstrap list.
_sentinel_brokers: "{{ groups[sentinel_kafka_group] | default([]) | sort }}"

# host-01:9092,host-02:9092,... Falls back to the previous hard-coded value
# when no broker group is present, so an inventory without one is unaffected.
# Sentinel runs as a host process, so the lab's /etc/hosts resolves these names
# — unlike the containerised roles, where Docker's resolver ignores that file.
_sentinel_bootstrap_servers: >-
  {{ (_sentinel_brokers | map('regex_replace', '$', ':' ~ sentinel_kafka_port) | join(','))
     if (_sentinel_brokers | length) > 0
     else 'localhost:' ~ sentinel_kafka_port }}

# The two APT file paths this role owns, derived from one constant rather than
# taken from the inventory.
#
# They were `defaults/` variables with the same name in all three OpenNMS
# roles, so a single `group_vars` entry pointed every role at one file and the
# last role to run decided its contents. Measured, not theorised: with one
# override set, three roles wrote `99-opennms.pref` and the per-role guarantee
# the pin depends on was gone.
#
# `vars/` rather than a role-prefixed default, because there is no reason to
# choose these paths. Prefixing would leave three knobs nobody wants, each
# still able to collide with the others. See the transition guard in tasks.
opennms_component: sentinel
_opennms_apt_preferences_file: /etc/apt/preferences.d/99-opennms-{{ opennms_component }}.pref
_opennms_unattended_blacklist_file: /etc/apt/apt.conf.d/51-opennms-{{ opennms_component }}-blacklist

# Where the JMX Prometheus exporter jar and its config land when
# `opennms_sentinel_jmx_exporter_port` is set, and the JVM option that loads it.
# In the component's own agent directory, next to the Pyroscope jar, so
# colocated components never share a file. `vars/` rather than defaults: the
# JVM option is built from these paths, so there is no reason to choose them.
_opennms_sentinel_jmx_exporter_jar: "{{ opennms_sentinel_home }}/agent/jmx_prometheus_javaagent.jar"
_opennms_sentinel_jmx_exporter_config_file: "{{ opennms_sentinel_home }}/agent/jmx-prometheus-exporter.yaml"
_opennms_sentinel_jmx_exporter_option: "-javaagent:{{ _opennms_sentinel_jmx_exporter_jar }}={{ opennms_sentinel_jmx_exporter_port }}:{{ _opennms_sentinel_jmx_exporter_config_file }}"

# Every Java agent loaded into the Karaf JVM, in load order. One list, because
# systemd keeps only the last EXTRA_JAVA_OPTS assignment in the sysconfig file
# and expands no $EXTRA_JAVA_OPTS, so each agent cannot add its own line.
_opennms_sentinel_java_agents: >-
  {{ (['-javaagent:' ~ opennms_sentinel_pyroscope_jar] if opennms_sentinel_pyroscope | length > 0 else [])
     + ([_opennms_sentinel_jmx_exporter_option] if opennms_sentinel_jmx_exporter_port | int > 0 else []) }}
