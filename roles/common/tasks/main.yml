---
- name: Refuse an unsupported platform
  ansible.builtin.include_tasks: assert-platform.yml
  tags:
    - always

- name: "Set Time Zone to {{ timezone }}"
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install base packages for {{ ansible_facts['os_family'] }}
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"
  tags:
    - system
    - tools
