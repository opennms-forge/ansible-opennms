---
# The ports 50-firewall.yml opens with UFW, in the default zone. Permanent and
# immediate, so they hold now and after a reload.
- name: Allow OpenNMS listener ports through firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ opennms_core_firewall_ports }}"
  tags:
    - opennms
    - firewall

# Upgraded hosts still carry the rules an earlier run opened. Remove the web
# port a loopback bind no longer serves and the HTTPS port when HTTPS is off,
# unless the inventory lists it in opennms_core_firewall_ports on purpose.
- name: Close the plaintext web port in firewalld when Jetty binds to loopback
  ansible.posix.firewalld:
    port: "{{ _opennms_core_web_port }}/tcp"
    permanent: true
    immediate: true
    state: disabled
  when:
    - _opennms_web_http_loopback | bool
    - (_opennms_core_web_port ~ '/tcp') not in opennms_core_firewall_ports
  tags:
    - opennms
    - firewall

- name: Close the HTTPS web port in firewalld when HTTPS is disabled
  ansible.posix.firewalld:
    port: "{{ opennms_web_https_port }}/tcp"
    permanent: true
    immediate: true
    state: disabled
  when:
    - not (opennms_web_https_enabled | bool)
    - (opennms_web_https_port | string ~ '/tcp') not in opennms_core_firewall_ports
  tags:
    - opennms
    - firewall
