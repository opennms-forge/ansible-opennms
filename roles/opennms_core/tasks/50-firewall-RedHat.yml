---
# The ports 50-firewall.yml opens with UFW, in the default zone. Permanent and
# immediate, so they hold now and after a reload.
- name: Allow OpenNMS listener ports through firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ opennms_core_firewall_ports }}"
  tags:
    - opennms
    - firewall
