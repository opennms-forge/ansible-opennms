---
- name: Create JMX Prometheus home directory
  ansible.builtin.file:
    path: "{{ prom_jmx_exporter_home }}"
    state: directory
    owner: "{{ prom_jmx_exporter_owner }}"
    group: "{{ prom_jmx_exporter_group }}"
    mode: "0750"
  tags:
    - "jmx-prometheus-exporter"

# The agent is loaded into the OpenNMS JVM at startup, so a new jar or a changed
# config only takes effect after a restart. Both tasks notify the shared handler
# rather than restarting inline, so several changes in one run collapse into a
# single restart at the end of the play.
- name: Installing JMX Prometheus Exporter
  ansible.builtin.get_url:
    url: "{{ prom_jmx_exporter_url }}"
    dest: "{{ prom_jmx_exporter_home }}/jmx_prometheus_javaagent.jar"
    checksum: "{{ prom_jmx_exporter_sha256 }}"
    owner: "{{ prom_jmx_exporter_owner }}"
    group: "{{ prom_jmx_exporter_group }}"
    mode: "0640"
  notify:
    - Restart opennms
  tags:
    - "jmx-prometheus-exporter"

- name: Create JMX Prometheus Exporter configuration
  ansible.builtin.template:
    src: prom-jmx-exporter/config.yml.j2
    dest: "{{ prom_jmx_exporter_home }}/config.yaml"
    owner: "{{ prom_jmx_exporter_owner }}"
    group: "{{ prom_jmx_exporter_group }}"
    mode: "0640"
  notify:
    - Restart opennms
  tags:
    - "jmx-prometheus-exporter"
