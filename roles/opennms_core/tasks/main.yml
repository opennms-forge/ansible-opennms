---
# Every dynamic include below carries tags, and they are the union of the tags
# used inside the file or role it pulls in. That is load-bearing rather than
# decorative: a dynamic include is only entered when the include task itself
# matches the tag filter, so an untagged include makes every tag inside it
# unreachable — `--tags kafka` then selects nothing and reports success. Inner
# tasks keep being filtered by their own tags, so the union widens what can be
# reached, never what runs. Add a tag inside one of these files and add it here
# too.
- name: Verify credentials before anything else
  ansible.builtin.include_tasks: 00-credentials-check.yml
  tags:
    - always

- name: Verify the host clock is synchronised
  ansible.builtin.include_role:
    name: timesync
  tags:
    - timesync

- name: Include OpenNMS OpenJDK roles
  ansible.builtin.include_role:
    name: openjdk
  vars:
    openjdk_version: 21
    openjdk_pkg_version: "21*"
  tags:
    - java

# No `vars:` block. `opennms_repositories` derives its dist from
# `opennms_version`, which is this role's own variable and is already in scope
# here, so the caller's release reaches it without being restated. The
# repository role's fallback lives under a name of its own, so there is no
# second definition of `opennms_version` for load order to choose between, and
# `opennms_version: "{{ opennms_version }}"` could not be passed anyway: a
# self-referential include var raises "recursive loop detected in template".
#
# Scope is what makes this work through `opennms_icmp` as well, which includes
# the repository role again on its own account. A value passed on an
# `include_role` reaches that role and everything nested inside it but not a
# sibling include that follows, so the previous explicit pass reached the
# include below and not the one inside `opennms_icmp` — which then resolved a
# default that nothing kept current, and rewrote the source at the wrong major.
- name: Include OpenNMS repository roles
  ansible.builtin.include_role:
    name: opennms_repositories
  tags:
    - opennms
    - repository

- name: Include OpenNMS ICMP setup roles
  ansible.builtin.include_role:
    name: opennms_icmp
  tags:
    - icmp
    - opennms

# Written before the packages are installed, so a deliberate `opennms_version`
# bump rewrites the pin and permits the new version in the same run. Reversing
# these two would mean the old pin blocks the upgrade the run is trying to make.
- name: Pin OpenNMS packages to {{ opennms_version }}
  ansible.builtin.template:
    src: etc/apt-preferences-opennms.j2
    dest: "{{ opennms_apt_preferences_file }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - opennms
    - packages

# Written next to the pin, and for the same reason: it must be in place before
# packages are installed so a run that bumps opennms_version is never racing a
# stale policy. Unconditional in the sense that matters -- no check for whether
# unattended-upgrades is installed. An apt.conf.d file declaring an option
# nothing reads is inert, so a guard would cost a fact-gathering round trip to
# decide something harmless either way.
- name: Blacklist OpenNMS packages from unattended-upgrades
  ansible.builtin.template:
    src: etc/apt-unattended-blacklist.j2
    dest: "{{ opennms_unattended_blacklist_file }}"
    owner: root
    group: root
    mode: "0644"
  when: opennms_unattended_upgrade_blacklist | bool
  tags:
    - opennms
    - packages

# Turning the variable off must take the file with it. Skipping the template
# task alone would leave a host that was once blacklisted still blacklisted,
# so the operator's opt-out would silently do nothing.
- name: Remove the unattended-upgrades blacklist when disabled
  ansible.builtin.file:
    path: "{{ opennms_unattended_blacklist_file }}"
    state: absent
  when: not opennms_unattended_upgrade_blacklist | bool
  tags:
    - opennms
    - packages

- name: Include tasks to install packages
  ansible.builtin.include_tasks: 01-packages.yml
  tags:
    - core
    - dependencies
    - opennms
    - perl
    - rrd
    - tools
    - web

- name: Include tasks to install JMX Prometheus exporter
  ansible.builtin.include_tasks: 02-jmx-prometheus-exporter.yml
  tags:
    - jmx-prometheus-exporter

- name: Include tasks to install the Pyroscope Java agent
  ansible.builtin.include_tasks: 03-pyroscope-agent.yml
  tags:
    - opennms
    - core
    - pyroscope

- name: Verify if Java configuration exists
  ansible.builtin.stat:
    path: "{{ opennms_home }}/etc/java.conf"
  register: java_conf

- name: Configure Java runtime environment
  become: true
  become_user: opennms
  ansible.builtin.command: "{{ opennms_home }}/bin/runjava -s"
  changed_when: java_conf.changed
  tags:
    - core
    - initialize

- name: Render OpenNMS environment configuration before database init
  ansible.builtin.include_tasks: 05-opennms-conf.yml
  tags:
    - configuration
    - openjdk
    - opennms

- name: Include tasks to setup the database
  ansible.builtin.include_tasks: 10-database-setup.yml
  tags:
    - credentials
    - database
    - initialize
    - opennms

- name: Include tasks configuring the core system
  ansible.builtin.include_tasks: 20-config.yml
  tags:
    - configuration
    - elasticsearch
    - opennms
    - webapp

- name: Configure Kafka as message broker
  ansible.builtin.include_tasks: 21-kafka.yml
  when: opennms_message_broker == "kafka"
  tags:
    - configuration
    - kafka
    - message-broker
    - opennms

- name: Configure the Prometheus remote_write time-series plugin
  ansible.builtin.include_tasks: 22-timeseries-plugin.yml
  when: opennms_remotewrite.enabled | default(false) | bool
  tags:
    - core
    - timeseries

- name: Enable systemd unit for OpenNMS {{ opennms_distribution }}
  ansible.builtin.service:
    name: opennms.service
    enabled: true
  tags:
    - core
    - systemd

- name: Start systemd unit for OpenNMS {{ opennms_distribution }}
  ansible.builtin.service:
    name: opennms.service
    state: started
  when:
    - skip_startup | default("false") == "false"
  tags:
    - core
    - systemd

# systemd reports the unit "started" as soon as the launcher returns, but the
# JVM/web UI take minutes to come up — and OpenNMS can still exit during that
# window (e.g. a Liquibase changelog-lock timeout). Wait for the web UI so the
# role only reports success once Core is actually serving, and fails clearly if
# it never becomes ready.
- name: Wait for OpenNMS Core to become ready
  ansible.builtin.uri:
    url: "http://localhost:8980/opennms/login.jsp"
    method: GET
    status_code: 200
  register: opennms_core_ready
  until: opennms_core_ready.status | default(0) == 200
  retries: "{{ opennms_startup_retries | default(30) }}"
  delay: "{{ opennms_startup_delay | default(10) }}"
  when:
    - skip_startup | default("false") == "false"
  tags:
    - core
    - systemd

- name: Check if UFW is installed
  ansible.builtin.command: which ufw
  register: ufw_binary_check
  ignore_errors: true
  tags:
    - core
    - firewall

- name: Include tasks to configure Firewall rules
  ansible.builtin.include_tasks: 50-firewall.yml
  when: ufw_binary_check.rc == 0
  tags:
    - core
    - firewall
    - opennms
