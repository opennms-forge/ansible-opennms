---
- name: Verify credentials before anything else
  ansible.builtin.include_tasks: 00-credentials-check.yml

- name: Include OpenNMS OpenJDK roles
  ansible.builtin.include_role:
    name: openjdk
  vars:
    openjdk_version: 21
    openjdk_pkg_version: "21*"

- name: Include OpenNMS repository roles
  ansible.builtin.include_role:
    name: opennms_repositories
  vars:
    # This role's own OpenNMS release decides which repository major to use.
    # Passed at include time rather than left to defaults precedence between
    # two roles, which depends on load order.
    opennms_repo_major: "{{ opennms_version.split('.')[0] }}"

- name: Include OpenNMS ICMP setup roles
  ansible.builtin.include_role:
    name: opennms_icmp

# Written before the packages are installed, so a deliberate `opennms_version`
# bump rewrites the pin and permits the new version in the same run. Reversing
# these two would mean the old pin blocks the upgrade the run is trying to make.
- name: Pin OpenNMS packages to {{ opennms_version }}
  ansible.builtin.template:
    src: etc/apt-preferences-opennms.j2
    dest: "{{ opennms_apt_preferences_file }}"
    owner: root
    group: root
    mode: "0644"
  tags:
    - opennms
    - packages

- name: Include tasks to install packages
  ansible.builtin.include_tasks: 01-packages.yml

- name: Include tasks to install JMX Prometheus exporter
  ansible.builtin.include_tasks: 02-jmx-prometheus-exporter.yml

- name: Verify if Java configuration exists
  ansible.builtin.stat:
    path: "{{ opennms_home }}/etc/java.conf"
  register: java_conf

- name: Configure Java runtime environment
  become: true
  become_user: opennms
  ansible.builtin.command: "{{ opennms_home }}/bin/runjava -s"
  changed_when: java_conf.changed
  tags:
    - core
    - initialize

- name: Render OpenNMS environment configuration before database init
  ansible.builtin.include_tasks: 05-opennms-conf.yml

- name: Include tasks to setup the database
  ansible.builtin.include_tasks: 10-database-setup.yml

- name: Include tasks configuring the core system
  ansible.builtin.include_tasks: 20-config.yml

- name: Configure Kafka as message broker
  ansible.builtin.include_tasks: 21-kafka.yml
  when: opennms_message_broker == "kafka"

- name: Configure the Prometheus remote_write time-series plugin
  ansible.builtin.include_tasks: 22-timeseries-plugin.yml
  when: opennms_remotewrite.enabled | default(false) | bool

- name: Enable systemd unit for OpenNMS {{ opennms_distribution }}
  ansible.builtin.service:
    name: opennms.service
    enabled: true
  tags:
    - core
    - systemd

- name: Start systemd unit for OpenNMS {{ opennms_distribution }}
  ansible.builtin.service:
    name: opennms.service
    state: started
  when:
    - skip_startup | default("false") == "false"
  tags:
    - core
    - systemd

# systemd reports the unit "started" as soon as the launcher returns, but the
# JVM/web UI take minutes to come up — and OpenNMS can still exit during that
# window (e.g. a Liquibase changelog-lock timeout). Wait for the web UI so the
# role only reports success once Core is actually serving, and fails clearly if
# it never becomes ready.
- name: Wait for OpenNMS Core to become ready
  ansible.builtin.uri:
    url: "http://localhost:8980/opennms/login.jsp"
    method: GET
    status_code: 200
  register: opennms_core_ready
  until: opennms_core_ready.status | default(0) == 200
  retries: "{{ opennms_startup_retries | default(30) }}"
  delay: "{{ opennms_startup_delay | default(10) }}"
  when:
    - skip_startup | default("false") == "false"
  tags:
    - core
    - systemd

- name: Check if UFW is installed
  ansible.builtin.command: which ufw
  register: ufw_binary_check
  ignore_errors: true
  tags:
    - core
    - firwall

- name: Include tasks to configure Firewall rules
  ansible.builtin.include_tasks: 50-firewall.yml
  when: ufw_binary_check.rc == 0
  tags:
    - core
    - firwall
