---
argument_specs:
  main:
    short_description: Deploys and configures OpenNMS Horizon Core.
    description:
      - Installs the OpenNMS Horizon Core server and webapp packages.
      - Initializes the PostgreSQL schema via C(install -dis).
      - Renders C(/opt/opennms/etc/opennms.conf) with environment variables that
        the pristine C(opennms-datasources.xml) and C(service-configuration.xml)
        resolve at OpenNMS startup.
    options:
      opennms_datasource_db_password:
        type: str
        default: "__SET_VIA_VAULT__"
        description:
          - PostgreSQL password for the OpenNMS application role.
          - SENSITIVE. The role refuses to run while this is the sentinel
            default (see C(tasks/00-credentials-check.yml)). Populate via the
            vault written by C(indigo423.opennms.init_secrets), or override
            directly in your inventory.
      postgres_password:
        type: str
        default: "__SET_VIA_VAULT__"
        description:
          - PostgreSQL administrative password used by C(scvcli set postgres-admin).
          - SENSITIVE. Same sentinel-default and bootstrap workflow as
            C(opennms_datasource_db_password).
      opennms_env:
        type: dict
        default: {}
        description:
          - Additional or overriding environment variables rendered into
            C(/opt/opennms/etc/opennms.conf) and exported to the OpenNMS JVM.
            This dict is merged ON TOP of the role's built-in env defaults
            (C(POSTGRES_HOST), C(POSTGRES_PORT), C(OPENNMS_DBNAME) derived
            from C(opennms_datasource_db_host/port/name)); siblings keep
            their defaults when you set only a subset.
          - Use this dict to tune SSL mode, connection-pool sizes, or any
            other env var the pristine C(opennms-datasources.xml) resolves
            via C(${env:...}) placeholders. The role does not set these by
            default because the pristine XML's literal defaults already
            apply.
      opennms_services:
        type: dict
        default: {}
        description:
          - "Daemon enable/disable toggles. Each key is a C(CORE_SERVICE_<NAME>_ENABLED)
            env var consumed by the pristine C(service-configuration.xml).
            Boolean values are rendered as lowercase strings."
          - "Empty by default - upstream defaults apply. Example:
            C({CORE_SERVICE_TELEMETRYD_ENABLED: false, CORE_SERVICE_SYSLOGD_ENABLED: true})."
      opennms_core_pinned_packages:
        type: list
        elements: str
        description:
          - OpenNMS packages this role holds at C(opennms_version) through
            /etc/apt/preferences.d, and removes from C(unattended-upgrades)
            consideration.
          - Named for the role on purpose. All three OpenNMS roles carry a list
            of their own, and a shared name meant one inventory entry replaced
            every role's list, leaving each pinning packages it does not
            install and its own package unpinned at the default priority.
          - Every entry must be a package whose versions track C(opennms_version).
            All three pin tiers key on it, and the last one gives every other
            version from the OpenNMS origin priority -1, so a package released
            on its own version line, such as C(jrrd2) or C(iplike), ends up with
            no installation candidate rather than a pin. Measured.
          - Debian and Ubuntu only. EL 10 reads C(opennms_core_rpm_pinned_packages).
      opennms_core_firewall_ports:
        type: list
        elements: str
        description:
          - Ports Core opens in the host firewall, as C(port/proto) or
            C(start-end/proto). UFW on Debian and Ubuntu when UFW is installed,
            firewalld on EL 10 when it is running.
          - The default is C(opennms_web_http_port), C(opennms_web_https_port)
            when HTTPS is enabled, C(10162/udp) and C(9999/udp), plus
            C(opennms_core_jmx_exporter_port) as TCP when it is set. Setting the list replaces it entirely.
      opennms_web_https_enabled:
        type: bool
        default: true
        description:
          - Serve the web UI over HTTPS. When false only the plaintext listener runs.
      opennms_web_https_host:
        type: str
        default: 0.0.0.0
        description:
          - Address the HTTPS listener binds to.
      opennms_web_https_port:
        type: int
        default: 8443
        description:
          - Port of the HTTPS listener.
      opennms_web_http_host:
        type: str
        default: 127.0.0.1
        description:
          - Address the plaintext listener binds to. Loopback by default; a non-loopback value exposes plaintext.
      opennms_web_http_port:
        type: int
        default: 8980
        description:
          - Port of the plaintext listener. Also used by the readiness check and the firewall default.
      opennms_web_base_url:
        type: str
        default: "{{ 'https' if opennms_web_https_enabled | bool else 'http' }}://%x%c/"
        description:
          - Value of C(opennms.web.base-url).
      opennms_tls_dir:
        type: str
        default: "{{ opennms_home }}/etc/tls"
        description:
          - Directory for the keystore, the password file and the self-signed material.
      opennms_tls_cert_path:
        type: str
        default: ""
        description:
          - Path on the target of your own certificate (PEM). Empty generates a self-signed one.
      opennms_tls_key_path:
        type: str
        default: ""
        description:
          - Path on the target of the private key for C(opennms_tls_cert_path).
      opennms_tls_chain_path:
        type: str
        default: ""
        description:
          - Path on the target of an optional intermediate chain (PEM).
      opennms_tls_keystore_password:
        type: str
        default: ""
        description:
          - SENSITIVE. Keystore password. Empty generates a random one and keeps it in a file under C(opennms_tls_dir).
      opennms_tls_selfsigned_common_name:
        type: str
        default: "{{ ansible_fqdn }}"
        description:
          - Common name of the self-signed certificate.
      opennms_tls_selfsigned_subject_alt_names:
        type: list
        elements: str
        default: []
        description:
          - Subject alternative names of the self-signed certificate, such as C(DNS:nms.example.org). Empty derives them from the host facts.
      opennms_tls_selfsigned_key_type:
        type: str
        choices:
          - ECC
          - RSA
        default: ECC
        description:
          - Key type of the self-signed certificate.
      opennms_tls_selfsigned_days:
        type: int
        default: 825
        description:
          - Validity of the self-signed certificate in days.
      opennms_tls_selfsigned_renew_days:
        type: int
        default: 30
        description:
          - Regenerate the self-signed certificate when fewer days than this remain.
      opennms_tls_selfsigned_organization:
        type: str
        default: ""
        description:
          - Organization (O) of the self-signed certificate. Empty omits it.
      opennms_tls_selfsigned_organizational_unit:
        type: str
        default: ""
        description:
          - Organizational unit (OU) of the self-signed certificate. Empty omits it.
      opennms_tls_selfsigned_country:
        type: str
        default: ""
        description:
          - Two-letter country (C) of the self-signed certificate. Empty omits it.
      opennms_core_jmx_exporter_port:
        type: int
        default: 0
        description:
          - Port the JMX Prometheus exporter listens on. C(0) leaves it off.
          - When set, the role installs the exporter from C(prom_jmx_exporter)
            in C(/opt/opennms/agent) and appends its C(-javaagent) option to
            C(ADDITIONAL_MANAGER_OPTIONS) in C(opennms.conf).
          - Do not load the exporter through C(opennms_jvm_conf) as well. The
            role refuses it.
      opennms_core_rpm_pinned_packages:
        type: list
        elements: str
        description:
          - OpenNMS packages this role holds at C(opennms_version) on EL 10,
            through its own block in /etc/dnf/plugins/versionlock.list.
          - A separate list because the RPM names differ from the Debian ones.
          - C(dnf upgrade) and C(dnf-automatic) both honour the lock, so EL 10
            needs no counterpart to C(opennms_unattended_upgrade_blacklist).
      opennms_pin_origin:
        type: str
        description:
          - The C(Origin) field the repository publishes, which the pin's
            exclusion tier keys on. Shared across the roles on purpose,
            because it is the same value everywhere, and a mirror publishing a
            different Origin is the one reason to set it.
          - No effect on EL 10.
      opennms_unattended_upgrade_blacklist:
        type: bool
        description:
          - Whether to add this role's pinned packages to
            C(Unattended-Upgrade::Package-Blacklist). Shared across the roles
            on purpose, because it is a policy switch that should hold for the
            whole host.
          - Setting it false re-exposes the two moves the preferences file
            cannot prevent on its own. It does not affect the cross-major
            protection.
          - No effect on EL 10, where the versionlock already stops both moves.
      skip_startup:
        type: bool
        default: false
        description:
          - Leave OpenNMS stopped. Skips the start, the C(Restart opennms) handler and the readiness wait.
          - A value that is not a boolean, such as C(skip), fails the role.
