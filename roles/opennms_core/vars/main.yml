---
# scvcli is run through bash explicitly: the packaged script reads java.conf
# with the bash-only $(<file) expansion under a #!/bin/sh shebang, which
# yields an empty java path on Debian/Ubuntu where sh is dash. Patching the
# script itself would be undone by every package upgrade.
scvcli_cmd: "bash {{ opennms_home }}/bin/scvcli"

# The two APT file paths this role owns, derived from one constant rather than
# taken from the inventory.
#
# They were `defaults/` variables with the same name in all three OpenNMS
# roles, so a single `group_vars` entry pointed every role at one file and the
# last role to run decided its contents. Measured, not theorised: with one
# override set, three roles wrote `99-opennms.pref` and the per-role guarantee
# the pin depends on was gone.
#
# `vars/` rather than a role-prefixed default, because there is no reason to
# choose these paths. Prefixing would leave three knobs nobody wants, each
# still able to collide with the others. See the transition guard in tasks.
opennms_component: core
_opennms_apt_preferences_file: /etc/apt/preferences.d/99-opennms-{{ opennms_component }}.pref
_opennms_unattended_blacklist_file: /etc/apt/apt.conf.d/51-opennms-{{ opennms_component }}-blacklist

# Optional remote-write plugin 2.2.0 write settings: `opennms_remotewrite` key
# to the plugin property it renders as. The template renders a key only when it
# is set, in this order; 22-timeseries-plugin.yml rejects a key not listed here
# or among the four base keys, so a misspelling fails the run instead of
# leaving the plugin on its default.
_opennms_remotewrite_optional_properties:
  async_writes: asyncWrites
  call_timeout_ms: callTimeoutInMs
  batching_enabled: batchingEnabled
  batch_shards: batchShards
  batch_max_samples: batchMaxSamples
  batch_linger_ms: batchLingerMs
  batch_shard_capacity: batchShardCapacity
  batch_max_retries: batchMaxRetries
  batch_retry_backoff_ms: batchRetryBackoffMs
  batch_enqueue_timeout_ms: batchEnqueueTimeoutMs
  external_tags_enabled: externalTagsEnabled
  external_tags_cache_size: externalTagsCacheSize
  external_tags_queue_size: externalTagsQueueSize
  external_tags_threads: externalTagsThreads
  external_tags_preload: externalTagsPreload

# The plaintext port Jetty serves, from opennms_web_http_port. The firewall
# default and the readiness wait both read it, so moving Jetty moves both
# (#249).
_opennms_core_web_port: "{{ opennms_web_http_port | string }}"

# The HTTPS port when HTTPS is enabled, else empty.
_opennms_core_https_port: "{{ (opennms_web_https_port | string) if opennms_web_https_enabled | bool else '' }}"

# TLS files the role manages under opennms_tls_dir.
_opennms_tls_keystore: "{{ opennms_tls_dir }}/jetty.p12"
_opennms_tls_password_file: "{{ opennms_tls_dir }}/keystore.pass"
_opennms_tls_selfsigned_key: "{{ opennms_tls_dir }}/jetty-selfsigned.key"
_opennms_tls_selfsigned_cert: "{{ opennms_tls_dir }}/jetty-selfsigned.crt"
_opennms_tls_byo: "{{ opennms_tls_cert_path | length > 0 }}"
_opennms_web_http_loopback: "{{ opennms_web_http_host in ['127.0.0.1', 'localhost', '::1'] }}"

# Where the readiness wait reaches the plaintext listener. A wildcard or
# loopback bind answers on 127.0.0.1. A specific address such as 10.0.0.5 does
# not listen on loopback, so the probe uses that address. An IPv6 literal other
# than :: or ::1 would need brackets in the URL and is not supported here.
_opennms_web_http_probe_host: "{{ '127.0.0.1' if (_opennms_web_http_loopback or opennms_web_http_host in ['0.0.0.0', '::']) else opennms_web_http_host }}"

# Subject alternative names of the self-signed certificate when the inventory
# lists none. The default address is added only when facts have it.
_opennms_tls_default_sans: >-
  {{ (['DNS:' ~ ansible_fqdn, 'DNS:' ~ ansible_hostname]
      + (['IP:' ~ ansible_default_ipv4.address] if ansible_default_ipv4.address is defined else [])
      + ['DNS:localhost', 'IP:127.0.0.1'])
     | select | unique | list }}
_opennms_tls_sans: >-
  {{ opennms_tls_selfsigned_subject_alt_names
     if opennms_tls_selfsigned_subject_alt_names | length > 0
     else _opennms_tls_default_sans }}

# Marker the managed jetty.xml carries, and the pristine copy it derives from.
_opennms_jetty_managed_marker: "HTTPS enabled by indigo423.opennms.opennms_core"
_opennms_jetty_pristine: "{{ opennms_home }}/etc/examples/jetty.xml"

# Keys the role renders itself. A key of the same name, or any
# org.opennms.netmgt.jetty.https-* key, in opennms_properties_webapp is refused.
_opennms_web_owned_keys:
  - opennms.web.base-url
  - org.opennms.netmgt.jetty.host
  - org.opennms.netmgt.jetty.port

# Where the JMX Prometheus exporter jar and its config land when
# `opennms_core_jmx_exporter_port` is set, and the JVM option that loads it.
# In the component's own agent directory, next to the Pyroscope jar, so
# colocated components never share a file. `vars/` rather than defaults: the
# JVM option is built from these paths, so there is no reason to choose them.
_opennms_core_jmx_exporter_jar: "{{ opennms_home }}/agent/jmx_prometheus_javaagent.jar"
_opennms_core_jmx_exporter_config_file: "{{ opennms_home }}/agent/jmx-prometheus-exporter.yaml"
_opennms_core_jmx_exporter_option: "-javaagent:{{ _opennms_core_jmx_exporter_jar }}={{ opennms_core_jmx_exporter_port }}:{{ _opennms_core_jmx_exporter_config_file }}"
