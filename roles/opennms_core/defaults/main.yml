---
opennms_distribution: Horizon
# renovate: datasource=github-tags depName=OpenNMS/opennms extractVersion=^opennms-(?<version>\d+\.\d+\.\d+)-\d+$
opennms_version: 36.0.5
opennms_pkg_version: "{{ opennms_version }}*"

opennms_home: /opt/opennms
opennms_message_broker: none

jrrd2_version: 2
jrrd2_pkg_version: "{{ jrrd2_version }}.*"

rrdtool_version: 1
rrdtool_pkg_version: "{{ rrdtool_version }}.*"

iplike_version: 2
iplike_pkg_version: "{{ iplike_version }}.*"

# Prometheus JMX exporter - off by default. Set the port it should listen on,
# such as 9299, and the role installs the pinned exporter from
# `prom_jmx_exporter`, appends its -javaagent option to
# ADDITIONAL_MANAGER_OPTIONS in opennms.conf, and opens the port in the host
# firewall. 0 is off. On a host that also runs Minion or Sentinel, give each
# component its own port.
opennms_core_jmx_exporter_port: 0

opennms_pkgs:
  - "jrrd2={{ jrrd2_pkg_version }}"
  - "opennms-common={{ opennms_pkg_version }}"
  - "opennms-server={{ opennms_pkg_version }}"
  - "opennms-webapp-jetty={{ opennms_pkg_version }}"
  - "opennms-webapp-hawtio={{ opennms_pkg_version }}"

opennms_tool_deps:
  - "rrdtool={{ rrdtool_pkg_version }}"

opennms_perl_deps:
  - libnet-snmp-perl
  - libxml2-utils
  - libwww-perl
  - libxml-twig-perl

# EL 10 counterparts, in dnf's name-version form. The RPM split differs:
# opennms-core and the two webapp packages, where Debian has opennms-common and
# opennms-server. The `opennms` meta package is avoided because it pulls in
# postgresql-server and a JDK.
opennms_rpm_pkgs:
  - "jrrd2-{{ jrrd2_pkg_version }}"
  - "opennms-core-{{ opennms_pkg_version }}"
  - "opennms-webapp-jetty-{{ opennms_pkg_version }}"
  - "opennms-webapp-hawtio-{{ opennms_pkg_version }}"

opennms_rpm_tool_deps:
  - "rrdtool-{{ rrdtool_pkg_version }}"

# libxml-twig-perl has no EL 10 counterpart outside EPEL, which this collection
# does not enable. Only bin/provision.pl and bin/daemon-stats.pl load it.
opennms_rpm_perl_deps:
  - perl-Net-SNMP
  - libxml2
  - perl-libwww-perl

pg_version: 18

# Datasource connection parameters.
#
# These variables drive the env-var entries rendered into /opt/opennms/etc/opennms.conf
# (see opennms_env below). OpenNMS Horizon 36 resolves placeholders in the pristine
# /opt/opennms/etc/opennms-datasources.xml using the chain:
#
#   ${scv:<key>:<field> | env:<VAR> | <literal default>}
#
# i.e. Secure Credential Vault first (populated by scvcli set in 10-database-setup.yml),
# then environment variables exported via opennms.conf, then the literal default baked
# into the pristine XML. The Ansible role owns the SCV writes and the opennms.conf
# render; it does NOT manage opennms-datasources.xml directly.
opennms_datasource_db_host: localhost
opennms_datasource_db_port: 5432
opennms_datasource_db_name: opennms_horizon

# Database credentials are intentionally sentinel-defaulted: the role refuses
# to run with these values (see tasks/00-credentials-check.yml). Provide real
# values via the vault populated by indigo423.opennms.init_secrets, or override
# directly in your inventory.
opennms_datasource_db_user: opennms
opennms_datasource_db_password: "__SET_VIA_VAULT__"

postgres_user: postgres
postgres_password: "__SET_VIA_VAULT__"

# Built-in env-var defaults rendered into opennms.conf. Only the host/port/dbname
# are populated here because the role needs them for install -dis and PostgreSQL
# setup, and opennms_datasource_db_name differs from the pristine literal. SSL
# and connection-pool tunables are intentionally absent: the pristine
# opennms-datasources.xml ships matching literal defaults, so the role would
# only emit redundant env vars. Set keys in `opennms_env` (below) to tune them.
_opennms_env_defaults:
  POSTGRES_HOST: "{{ opennms_datasource_db_host }}"
  POSTGRES_PORT: "{{ opennms_datasource_db_port }}"
  OPENNMS_DBNAME: "{{ opennms_datasource_db_name }}"

# Additional or overriding env vars merged on top of `_opennms_env_defaults` and
# rendered into /opt/opennms/etc/opennms.conf. Only specify keys you want to
# override or add — siblings keep their defaults. Example:
#   opennms_env:
#     POSTGRES_HOST: db.example.com   # override one key; others stay default
#     PYROSCOPE_SERVER_ADDRESS: http://pyro.local:4040
opennms_env: {}

# Daemon enable/disable toggles for OpenNMS services. Each key is a
# CORE_SERVICE_<NAME>_ENABLED env var resolved by the pristine service-configuration.xml.
# Empty by default - upstream defaults apply. Override per topology, e.g.:
#   opennms_services:
#     CORE_SERVICE_TELEMETRYD_ENABLED: false
#     CORE_SERVICE_SYSLOGD_ENABLED: true
opennms_services: {}

# Built-in JVM-tunable defaults rendered into opennms.conf. Kept separate from
# the operator-facing `opennms_jvm_conf` below, and merged the same way
# `_opennms_env_defaults` is: setting one key there used to replace this whole
# dict, so tuning the heap silently dropped the profiling configuration.
#
# Continuous profiling. bin/opennms loads $OPENNMS_HOME/agent/pyroscope-agent.jar
# when PYROSCOPE_AGENT_ENABLED is greater than zero, and the `pyroscope_agent`
# role has already replaced that jar with the version this collection pins
# (Horizon 36 ships 0.13.1). Set it to 1 in `opennms_jvm_conf` and restart to
# profile; the other two keys are read by the agent itself.
#
# Only these three profiling keys belong here. Keys in this dict are rendered
# WITHOUT `export`, so they stay shell-local to bin/opennms — which then exports
# those two by name on its own. Any further agent setting
# (PYROSCOPE_UPLOAD_INTERVAL, PYROSCOPE_AUTH_TOKEN, PYROSCOPE_HTTP_HEADERS, ...)
# has to go in `opennms_env` instead, or the agent never sees it. Do not restate
# these three there: the template refuses to render a key defined in both.
_opennms_jvm_conf_defaults:
  PYROSCOPE_AGENT_ENABLED: 0
  PYROSCOPE_APPLICATION_NAME: Horizon-Core
  PYROSCOPE_SERVER_ADDRESS: http://localhost:4040

# Additional or overriding JVM tunables merged on top of
# `_opennms_jvm_conf_defaults`. Only specify keys you want to override or add —
# siblings keep their defaults. Example:
#   opennms_jvm_conf:
#     JAVA_INITIAL_HEAP_SIZE: 2048
#     JAVA_HEAP_SIZE: 4096
#     PYROSCOPE_AGENT_ENABLED: 1      # profiling on; the other two keys survive
#
# Do not load the JMX Prometheus exporter here; set
# `opennms_core_jmx_exporter_port` instead. A `-javaagent` option for it in
# ADDITIONAL_MANAGER_OPTIONS fails the run. Other ADDITIONAL_MANAGER_OPTIONS
# are kept, and the exporter option is appended after them.
opennms_jvm_conf: {}

opennms_properties_timeseries:
  org.opennms.rrd.strategyClass: org.opennms.netmgt.rrd.rrdtool.MultithreadedJniRrdStrategy
  org.opennms.rrd.interfaceJar: /usr/share/java/jrrd2.jar
  opennms.library.jrrd2: /usr/lib/jni/libjrrd2.so
  org.opennms.web.graphs.engine: rrdtool
  rrd.binary: /usr/bin/rrdtool

opennms_properties_message_broker:
  org.opennms.activemq.broker.disable: true
  org.opennms.core.ipc.strategy: kafka
  org.opennms.core.ipc.sink.initialSleepTime: 60000
  org.opennms.core.ipc.kafka.bootstrap.servers: localhost:9092

# Elasticsearch flow persistence - disabled by default on Core.
# Enable when running a single-node stack without Sentinel.
# Do NOT enable on Core and Sentinel at the same time.
# See inventory/group_vars/opennms_stack/vars.yml for override examples.
opennms_elastic_flows: {}

# Ports opened in the host firewall: UFW on Debian and Ubuntu when UFW is
# installed, firewalld on EL 10 when it is running. `port/proto`, or
# `start-end/proto` for a range. The web port follows opennms_web_http_port,
# opennms_web_https_port is added when HTTPS is enabled, and so is
# opennms_core_jmx_exporter_port. Setting the list replaces it entirely.
opennms_core_firewall_ports: >-
  {{ ([] if _opennms_web_http_loopback else [_opennms_core_web_port ~ '/tcp'])
     + ([_opennms_core_https_port ~ '/tcp'] if _opennms_core_https_port | length > 0 else [])
     + ['10162/udp', '9999/udp']
     + ([opennms_core_jmx_exporter_port ~ '/tcp'] if opennms_core_jmx_exporter_port | int > 0 else []) }}

# Web UI listeners. The role renders opennms.web.base-url and the Jetty bind and
# TLS keys from these, so they must not appear in opennms_properties_webapp
# (tasks/00-web-guards.yml rejects them there).
opennms_web_https_enabled: true
opennms_web_https_host: 0.0.0.0
opennms_web_https_port: 8443
# Plaintext stays on loopback so only a local reverse proxy or the role's own
# readiness check reaches it.
opennms_web_http_host: 127.0.0.1
opennms_web_http_port: 8980
opennms_web_base_url: "{{ 'https' if opennms_web_https_enabled | bool else 'http' }}://%x%c/"

# TLS material. Set opennms_tls_cert_path and opennms_tls_key_path to supply
# your own certificate; leave them empty for a self-signed one.
opennms_tls_dir: "{{ opennms_home }}/etc/tls"
opennms_tls_cert_path: ""
opennms_tls_key_path: ""
opennms_tls_chain_path: ""
# Empty generates a random password on first run and keeps it in a file.
opennms_tls_keystore_password: ""
opennms_tls_selfsigned_common_name: "{{ ansible_fqdn }}"
opennms_tls_selfsigned_subject_alt_names: []
opennms_tls_selfsigned_key_type: ECC
opennms_tls_selfsigned_days: 825
opennms_tls_selfsigned_renew_days: 30
opennms_tls_selfsigned_organization: ""
opennms_tls_selfsigned_organizational_unit: ""
opennms_tls_selfsigned_country: ""

# Extra OpenNMS web properties. The bind, port, base URL and HTTPS keys are
# owned by the opennms_web_* and opennms_tls_* variables above.
opennms_properties_webapp: {}
  # org.opennms.netmgt.jetty.ajp-port: 8981
  # org.opennms.netmgt.jetty.sendServerVersion: false
  # org.opennms.netmgt.jetty.enableRequestLogging: false
  # org.opennms.netmgt.jetty.requestHeaderSize: 4000
  # org.eclipse.jetty.server.Request.maxFormKeys: 2000
  # org.eclipse.jetty.server.Request.maxFormContentSize: 200000
  # org.opennms.netmgt.jetty.relativeRedirectAllowed=true

# Prometheus remote_write time-series plugin (opennms-prometheus-remotewrite-plugin).
# Enable per-deployment. Serves any remote_write backend — Mimir, VictoriaMetrics,
# Cortex, Thanos — via write_url.
opennms_remotewrite:
  enabled: false
  write_url: "http://localhost:8080/api/v1/push"
  read_url: "http://localhost:8080/prometheus/api/v1"
  organization_id: ""
  # Optional plugin 2.2.0 write settings, rendered only when set; an unset key
  # takes the plugin default. The key-to-property table is in vars/main.yml and
  # the role README; an unknown key fails the run.
  # async_writes: true
  # call_timeout_ms: 10000
  # batching_enabled: true
  # batch_shards, batch_max_samples, batch_linger_ms, batch_shard_capacity,
  # batch_max_retries, batch_retry_backoff_ms, batch_enqueue_timeout_ms
  # external_tags_enabled, external_tags_cache_size, external_tags_queue_size,
  # external_tags_threads, external_tags_preload
# Bare version; the URL below supplies the "v" that upstream's release tags use.
# extractVersion keeps Renovate from writing the raw `v`-prefixed tag, which
# would compose a double-"v" URL that 404s.
# renovate: datasource=github-releases depName=OpenNMS-Plugins/opennms-prometheus-remotewrite-plugin extractVersion=^v?(?<version>.+)$
opennms_remotewrite_version: 2.2.0
opennms_remotewrite_kar_url: "https://github.com/OpenNMS-Plugins/opennms-prometheus-remotewrite-plugin/releases/download/v{{ opennms_remotewrite_version }}/opennms-prometheus-remotewrite-plugin.kar"
opennms_remotewrite_feature: "opennms-plugins-prometheus-remotewrite"

# OpenNMS packages pinned by the APT preferences file this role writes, so a
# routine `apt upgrade` cannot move them. System packages (rrdtool, jrrd2,
# iplike) are deliberately excluded — they should still receive security fixes.
opennms_core_pinned_packages:
  - opennms-common
  - opennms-server
  - opennms-webapp-jetty
  - opennms-webapp-hawtio

# The EL 10 counterpart, locked with DNF versionlock. The RPMs are split
# differently: opennms-core carries what Debian ships as opennms-common and
# opennms-server.
opennms_core_rpm_pinned_packages:
  - opennms-core
  - opennms-webapp-jetty
  - opennms-webapp-hawtio

# The `Origin:` field the repository publishes, which the pin's exclusion tier
# keys on. Not a hostname: `Pin: origin <host>` matches the site, so keying on
# the URL would silently disable the tier for anyone pointing
# `opennms_repo_url` at a mirror. See the template for the full reasoning.
#
# The same-major tier needs no variable at all — it is a version glob derived
# from `opennms_version`, so it cannot diverge from the dist the source line
# points at the way a Codename-keyed pin could.
opennms_pin_origin: OpenNMS

# Removes the pinned packages from `unattended-upgrades` consideration. On by
# default, because the preferences file cannot express "prefer exactly this
# version, and if it is gone, do nothing": two of its tiers admit a version an
# unattended host will move to with nobody watching. Tier 1 matches any Debian
# revision of the configured release, so a reissued `-2` moves and restarts the
# service on a day nothing here changed. Tier 2 admits a newer patch once the
# configured version leaves the repository. Both measured, not assumed.
#
# Opt-out rather than opt-in: a control that stays off until someone reads a
# README is off, and the pin itself is not opt-in. Setting this false accepts
# both moves. It does not affect the cross-major protection, which is the
# preferences file's -1 tier.
opennms_unattended_upgrade_blacklist: true

# Leave OpenNMS stopped: skips the start, the `Restart opennms` handler and
# the readiness wait. Read through `bool`, so `false` and "false" both start it.
skip_startup: false

# Readiness wait after the start: polls for the web UI, then for every enabled
# service via `bin/opennms status`. Retries per gate, and seconds between polls.
# A status poll takes up to 31 s itself while the JVM has not answered.
opennms_startup_retries: 30
opennms_startup_delay: 10
