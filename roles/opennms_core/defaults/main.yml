---
opennms_distribution: Horizon
opennms_version: 36.0.0
opennms_pkg_version: "{{ opennms_version }}*"

opennms_home: /opt/opennms
opennms_message_broker: none

jrrd2_version: 2
jrrd2_pkg_version: "{{ jrrd2_version }}.*"

rrdtool_version: 1
rrdtool_pkg_version: "{{ rrdtool_version }}.*"

iplike_version: 2
iplike_pkg_version: "{{ iplike_version }}.*"

prom_jmx_exporter_owner: opennms
prom_jmx_exporter_group: opennms
prom_jmx_exporter_version: 1.5.0
prom_jmx_exporter_url: "https://github.com/prometheus/jmx_exporter/releases/download/{{ prom_jmx_exporter_version }}/jmx_prometheus_javaagent-{{ prom_jmx_exporter_version }}.jar"
prom_jmx_exporter_sha256: sha256:0315f3f657876302c6205a98d4036ec775dca529c5d0419ca60ee669c688239f
prom_jmx_exporter_home: /opt/prom-jmx-exporter
prom_jmx_exporter_config:
  start_delay_seconds: 0
  lowercase_output_name: true
  lowercase_output_label_names: true
  auto_exclude_object_name_attributes: true
  include_object_names:
    - "java.lang:*"
    - "OpenNMS:*"
    - "org.opennms.*:*"
    - "org.opennms.newts:name=ring-buffer*"
    - "org.opennms.newts:name=repository.samples-inserted*"
    - "org.opennms.core.ipc.rpc:*"
    - "com.zaxxer.hikari:*"

opennms_pkgs:
  - "jrrd2={{ jrrd2_pkg_version }}"
  - "opennms-common={{ opennms_pkg_version }}"
  - "opennms-server={{ opennms_pkg_version }}"
  - "opennms-webapp-jetty={{ opennms_pkg_version }}"
  - "opennms-webapp-hawtio={{ opennms_pkg_version }}"

opennms_tool_deps:
  - "rrdtool={{ rrdtool_pkg_version }}"

opennms_perl_deps:
  - libnet-snmp-perl
  - libxml2-utils
  - libwww-perl
  - libxml-twig-perl

pg_version: 18

# Datasource connection parameters.
#
# These variables drive the env-var entries rendered into /opt/opennms/etc/opennms.conf
# (see opennms_env below). OpenNMS Horizon 36 resolves placeholders in the pristine
# /opt/opennms/etc/opennms-datasources.xml using the chain:
#
#   ${scv:<key>:<field> | env:<VAR> | <literal default>}
#
# i.e. Secure Credential Vault first (populated by scvcli set in 10-database-setup.yml),
# then environment variables exported via opennms.conf, then the literal default baked
# into the pristine XML. The Ansible role owns the SCV writes and the opennms.conf
# render; it does NOT manage opennms-datasources.xml directly.
opennms_datasource_db_host: localhost
opennms_datasource_db_port: 5432
opennms_datasource_db_name: opennms_horizon
opennms_datasource_ssl_mode: prefer
opennms_datasource_ssl_factory: org.postgresql.ssl.LibPQFactory

# The plaintext passwords below are POC-grade defaults suitable only for lab/dev use.
# Override via Ansible Vault for any deployment beyond local testing.
opennms_datasource_db_user: opennms
opennms_datasource_db_password: p4a55word!

postgres_user: postgres
postgres_password: oth3rP455w0rd!

opennms_datasource_connection_pool_idle_timeout: 600
opennms_datasource_connection_pool_login_timeout: 3
opennms_datasource_connection_pool_min_pool: 25
opennms_datasource_connection_pool_max_pool: 50
opennms_datasource_connection_pool_max_size: 50

# Built-in env-var defaults derived from the legacy connection variables above.
# Treated as private (underscore prefix); users should NOT override this dict
# directly. To override individual env vars without losing the defaults, set
# entries in `opennms_env` (below) — the role merges `opennms_env` over
# `_opennms_env_defaults` in the template.
_opennms_env_defaults:
  POSTGRES_HOST: "{{ opennms_datasource_db_host }}"
  POSTGRES_PORT: "{{ opennms_datasource_db_port }}"
  OPENNMS_DBNAME: "{{ opennms_datasource_db_name }}"
  POSTGRES_SSL_MODE: "{{ opennms_datasource_ssl_mode }}"
  POSTGRES_SSL_FACTORY: "{{ opennms_datasource_ssl_factory }}"
  OPENNMS_DATABASE_CONNECTION_IDLETIMEOUT: "{{ opennms_datasource_connection_pool_idle_timeout }}"
  OPENNMS_DATABASE_CONNECTION_LOGINTIMEOUT: "{{ opennms_datasource_connection_pool_login_timeout }}"
  OPENNMS_DATABASE_CONNECTION_MINPOOL: "{{ opennms_datasource_connection_pool_min_pool }}"
  OPENNMS_DATABASE_CONNECTION_MAXPOOL: "{{ opennms_datasource_connection_pool_max_pool }}"
  OPENNMS_DATABASE_CONNECTION_MAXSIZE: "{{ opennms_datasource_connection_pool_max_size }}"

# Additional or overriding env vars merged on top of `_opennms_env_defaults` and
# rendered into /opt/opennms/etc/opennms.conf. Only specify keys you want to
# override or add — siblings keep their defaults. Example:
#   opennms_env:
#     POSTGRES_HOST: db.example.com   # override one key; others stay default
#     PYROSCOPE_SERVER_ADDRESS: http://pyro.local:4040
opennms_env: {}

# Daemon enable/disable toggles for OpenNMS services. Each key is a
# CORE_SERVICE_<NAME>_ENABLED env var resolved by the pristine service-configuration.xml.
# Empty by default - upstream defaults apply. Override per topology, e.g.:
#   opennms_services:
#     CORE_SERVICE_TELEMETRYD_ENABLED: false
#     CORE_SERVICE_SYSLOGD_ENABLED: true
opennms_services: {}

opennms_jvm_conf:
  # JAVA_INITIAL_HEAP_SIZE: 2048
  # JAVA_HEAP_SIZE: 4096
  PYROSCOPE_AGENT_ENABLED: 0
  PYROSCOPE_APPLICATION_NAME: Horizon-Core
  PYROSCOPE_SERVER_ADDRESS: http://localhost:4040
  # ADDITIONAL_MANAGER_OPTIONS="-javaagent:/usr/share/opennms/lib/jmx_prometheus_javaagent-0.20.0.jar=9299:/usr/share/opennms/etc/jmx-exporter-config.yaml"

opennms_properties_timeseries:
  org.opennms.rrd.strategyClass: org.opennms.netmgt.rrd.rrdtool.MultithreadedJniRrdStrategy
  org.opennms.rrd.interfaceJar: /usr/share/java/jrrd2.jar
  opennms.library.jrrd2: /usr/lib/jni/libjrrd2.so
  org.opennms.web.graphs.engine: rrdtool
  rrd.binary: /usr/bin/rrdtool

opennms_properties_message_broker:
  org.opennms.activemq.broker.disable: true
  org.opennms.core.ipc.strategy: kafka
  org.opennms.core.ipc.sink.initialSleepTime: 60000
  org.opennms.core.ipc.kafka.bootstrap.servers: localhost:9092

# Elasticsearch flow persistence - disabled by default on Core.
# Enable when running a single-node stack without Sentinel.
# Do NOT enable on Core and Sentinel at the same time.
# See group_vars/opennms_stack/vars.yml for override examples.
opennms_elastic_flows: {}

opennms_properties_webapp:
  opennms.web.base-url: http://%x%c/
  # org.opennms.netmgt.jetty.host: 0.0.0.0
  org.opennms.netmgt.jetty.port: 8980
  # org.opennms.netmgt.jetty.https-keystore: /opt/opennms/etc/jetty.keystore
  # org.opennms.netmgt.jetty.https-keystorepassword: changeit
  # org.opennms.netmgt.jetty.https-keypassword: changeit
