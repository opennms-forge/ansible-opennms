---
- name: Include OpenNMS OpenJDK roles
  ansible.builtin.include_role:
    name: openjdk
  vars:
    openjdk_version: 21
    openjdk_pkg_version: "21*"

- name: Create Kafka system user
  ansible.builtin.user:
    comment: Ansible managed system account for Kafka
    name: kafka
    home: "{{ kafka_home }}"
    system: true
    state: present
    shell: /bin/false

- name: Create Kafka app directory
  ansible.builtin.file:
    path: /opt/kafka_{{ scala_version }}-{{ kafka_version }}
    state: directory
    mode: '0755'
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"

- name: Create Kafka config directory
  ansible.builtin.file:
    path: /opt/kafka_{{ scala_version }}-{{ kafka_version }}/config/kraft
    state: directory
    mode: '0755'
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"

- name: Extract Kafka binary
  ansible.builtin.unarchive:
    src: "{{ kafka_url }}"
    dest: /opt
    creates: /opt/kafka_{{ scala_version }}-{{ kafka_version }}/bin
    remote_src: true
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
  tags:
    - opennms
    - kafka
    - package

- name: Create Kafka log directory
  ansible.builtin.file:
    path: /var/log/kafka
    state: directory
    mode: '0755'
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"

- name: Create Kafka log directory
  ansible.builtin.file:
    path: /var/log/kafka/combined-logs
    state: directory
    mode: '0755'
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"

- name: Configure the Kafka message broker
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_home }}/config/kraft/server.properties"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    mode: "0640"
  with_dict: "{{ kafka_server_properties }}"
  tags:
    - opennms
    - kafka
    - config
  notify:
    - Restart kafka

- name: Verify if Kafka Cluster UUID exists
  ansible.builtin.stat:
    path: "{{ kafka_home }}/ansible_cluster_id"
  register: initialized_cluster_uuid
  tags:
    - opennms
    - kafka
    - config

# Every broker in a KRaft cluster must be formatted with the SAME cluster ID.
# Generating one per host, as this role used to, leaves brokers unable to join
# each other (INCONSISTENT_CLUSTER_ID). Establish it once for the whole cluster
# on the first member — reusing the ID already on disk if that member has been
# formatted before, so re-runs and added nodes converge on the existing cluster.
- name: Read the cluster ID already on the first broker
  ansible.builtin.slurp:
    src: "{{ kafka_home }}/ansible_cluster_id"
  delegate_to: "{{ _kafka_members[0] }}"
  run_once: true
  register: _kafka_existing_cluster_id
  failed_when: false
  when: kafka_cluster_id | length == 0
  tags:
    - opennms
    - kafka
    - config

- name: Generate a cluster ID for the cluster
  ansible.builtin.command: "{{ kafka_home }}/bin/kafka-storage.sh random-uuid"
  delegate_to: "{{ _kafka_members[0] }}"
  run_once: true
  register: _kafka_generated_cluster_id
  changed_when: false
  when:
    - kafka_cluster_id | length == 0
    - _kafka_existing_cluster_id.content is not defined
  tags:
    - opennms
    - kafka
    - config

- name: Resolve the effective cluster ID
  ansible.builtin.set_fact:
    _kafka_effective_cluster_id: >-
      {{ kafka_cluster_id if (kafka_cluster_id | length > 0)
         else (_kafka_existing_cluster_id.content | b64decode | trim
               if _kafka_existing_cluster_id.content is defined
               else _kafka_generated_cluster_id.stdout | trim) }}
  tags:
    - opennms
    - kafka
    - config

- name: Format the Kafka storage directory
  ansible.builtin.shell: |
    cd {{ kafka_home }}
    printf '%s\n' "{{ _kafka_effective_cluster_id }}" > ansible_cluster_id
    chown "{{ kafka_user }}:{{ kafka_group }}" ansible_cluster_id
    bin/kafka-storage.sh format --ignore-formatted -t "{{ _kafka_effective_cluster_id }}" -c config/kraft/server.properties
  when: not initialized_cluster_uuid.stat.exists
  register: cluster_uuid_output
  changed_when: cluster_uuid_output.rc == 0
  tags:
    - opennms
    - kafka
    - config

- name: Set ownership and permissions
  ansible.builtin.file:
    path: "{{ kafka_log_dir }}"
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    recurse: true
    mode: "0755"
  tags:
    - opennms
    - kafka
    - config

- name: Install Kafka Systemd unit
  ansible.builtin.template:
    src: kafka.service.j2
    dest: /etc/systemd/system/kafka.service
    mode: '0644'
  notify:
    - Reload systemd
  tags:
    - opennms
    - kafka
    - systemd

- name: Enable systemd unit for Kafka
  ansible.builtin.service:
    name: kafka.service
    enabled: true
  tags:
    - opennms
    - kafka
    - systemd

- name: Start systemd unit for Kafka
  ansible.builtin.service:
    name: kafka.service
    state: started
  when:
    - skip_kafka_startup | default("false") == "false"
  tags:
    - opennms
    - kafka
    - systemd
