---
kafka_version: 4.2.0
scala_version: 2.13
# archive.apache.org permanently hosts all releases; dlcdn.apache.org drops
# superseded versions, which breaks pinned kafka_version values over time.
kafka_url: https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz
kafka_home: /opt/kafka_{{ scala_version }}-{{ kafka_version }}
kafka_advertised_listener: PLAINTEXT://localhost:9092
kafka_user: kafka
kafka_group: kafka
kafka_log_dir: /var/log/kafka/combined-logs

# Inventory group whose members form the KRaft cluster. One member keeps the
# previous single-broker behaviour; more than one derives node ids, quorum
# voters, advertised listeners and replication factors from the group.
kafka_cluster_group: message_broker
kafka_broker_port: 9092
kafka_controller_port: 9093

# All brokers in a KRaft cluster must be formatted with the same cluster ID.
# Left empty, the role establishes one for the cluster — reusing the ID already
# on the first member if it has been formatted before, otherwise generating one
# — and applies it to every member. Set explicitly to pin it.
kafka_cluster_id: ""

# Replication for the internal topics. Derived from the member count, capped at
# 3, with min.isr at a majority once there is more than one broker. Kafka
# refuses to start if these exceed the number of brokers.

kafka_server_properties:
  "process.roles": broker,controller
  "node.id": 1
  "controller.quorum.voters": 1@localhost:9093
  listeners: PLAINTEXT://:9092,CONTROLLER://:9093
  "inter.broker.listener.name": PLAINTEXT
  "advertised.listeners": PLAINTEXT://localhost:9092
  "controller.listener.names": CONTROLLER
  "listener.security.protocol.map": CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
  "num.network.threads": 3
  "num.io.threads": 8
  "socket.send.buffer.bytes": 102400
  "socket.receive.buffer.bytes": 102400
  "socket.request.max.bytes": 104857600
  "num.partitions": 1
  "num.recovery.threads.per.data.dir": 1
  "offsets.topic.replication.factor": 1
  "transaction.state.log.replication.factor": 1
  "transaction.state.log.min.isr": 1
  "log.retention.hours": 168
  "log.segment.bytes": 1073741824
  "log.retention.check.interval.ms": 300000
  "log.dirs": "{{ kafka_log_dir }}"
