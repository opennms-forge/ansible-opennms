---
- name: Refuse an unsupported platform
  ansible.builtin.include_tasks: assert-platform.yml
  tags:
    - always

- name: Load the OpenJDK layout for {{ ansible_facts['os_family'] }}
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags:
    - always

- name: Install OpenJDK for {{ ansible_facts['os_family'] }}
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"
  tags:
    - java

- name: Set OpenJDK default java version
  community.general.alternatives:
    name: java
    path: "{{ _openjdk_java_path }}"
  tags:
    - java
