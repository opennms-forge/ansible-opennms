---
# Installed here rather than in `common` because this role is the gpg consumer
# and is included by every component role — the targeted playbooks
# (hzn-*-deployment.yml) and standalone Galaxy consumers never run `common`.
# Minimal cloud images ship without gnupg.
- name: Install gnupg for repository key handling
  ansible.builtin.apt:
    pkg:
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - opennms
    - repository

- name: Download OpenNMS repository key
  ansible.builtin.get_url:
    url: "{{ opennms_key_url }}"
    dest: /tmp/opennms-repo.key
    mode: "0644"
    checksum: "sha256:{{ opennms_key_sha256 }}"
  tags:
    - opennms
    - repository

- name: Convert the OpenNMS repository key to GPG format
  ansible.builtin.command: "gpg --batch --yes --dearmor -o /tmp/opennms-repo-keyring.gpg /tmp/opennms-repo.key"
  changed_when: false
  tags:
    - opennms
    - repository

- name: Install OpenNMS repository keyring
  ansible.builtin.copy:
    src: /tmp/opennms-repo-keyring.gpg
    dest: "{{ opennms_key_ring_file }}"
    mode: "0644"
    remote_src: true
  tags:
    - opennms
    - repository

- name: Install OpenNMS APT repository for stable releases
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ arch }} signed-by={{ opennms_key_ring_file }}] {{ opennms_repo_url }} stable main"
    state: present
    update_cache: true
  tags:
    - opennms
    - repository
