---
# gnupg2 is in every EL 10 install today, but the key verification reads its
# output, so it is stated rather than assumed.
- name: Install gnupg for repository key handling
  ansible.builtin.dnf:
    name: gnupg2
    state: present
  tags:
    - opennms
    - repository
