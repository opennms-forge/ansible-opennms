---
# Specify the OpenNMS version.
# Pick a very specific version cause we can't handle updates automatically.
arch: amd64

opennms_key_url: https://debian.opennms.org/OPENNMS-GPG-KEY

# Accepted signing-key fingerprints. This is the authoritative trust control:
# a fingerprint is the key's identity, so it survives re-exports and host
# migrations that change the key *file*'s bytes without changing the key.
# A list, not a scalar, so a key rollover is an append rather than a swap.
# See README.md for the provenance of the pinned value.
opennms_key_fingerprints:
  - "701E145FE26283F8C073BAAE697677243260D071"

# Optional file-hash pin, off by default. Pinning the bytes of a live-served
# key file breaks on harmless re-exports (see issue #139), so the collection
# ships no default. Set it to opt into a second, stricter gate.
opennms_key_sha256: null

opennms_key_ring_file: /usr/share/keyrings/opennms-stable-archive-keyring.gpg
opennms_repo_url: https://debian.opennms.org

# Name of the sources file this role owns, without the .list suffix.
#
# Deliberately independent of the dist. Left to Ansible, the filename is derived
# from the repo line — dist included — so every dist change wrote a *new* file
# and left the previous one enabled: `stable` alongside `opennms-36`, and one
# more orphan per major bump after that. A fixed name makes a dist change
# rewrite the entry instead of adding one.
#
# Also chosen so it cannot match the `debian_opennms_org_*.list` cleanup below,
# which reclaims the derived names earlier runs left behind.
opennms_repo_filename: opennms

# Fallback OpenNMS release, used only when no caller defines `opennms_version`:
# `stub_pgsql` on a database host that runs no component role, `opennms_icmp`
# installed standalone from Galaxy, and direct consumers of this role.
#
# A full version rather than a bare major, and under a name of its own rather
# than `opennms_version`. Both are load-bearing.
#
# The bare major it replaces was maintained by nobody. Renovate's custom
# manager updates every annotated occurrence of the release together, so the
# three component roles moved and this one did not, and the dist stopped
# matching the version pin. An annotated full version cannot drift; an
# unannotated major is the only thing here that could.
#
# The distinct name is what keeps the resolution unambiguous. Restating
# `opennms_version` here would put two role defaults under one name and leave
# which one wins to role load order, and passing it through as
# `opennms_version: "{{ opennms_version }}"` at include time is a recursive
# definition — measured, it raises "recursive loop detected in template".
# Under a different name the caller's value simply wins, because this one is
# consulted only when there is no caller value at all.
#
# renovate: datasource=github-tags depName=OpenNMS/opennms extractVersion=^opennms-(?<version>\d+\.\d+\.\d+)-\d+$
opennms_repo_fallback_version: 36.0.4

# Explicit per-major dist rather than the `stable` alias. `stable` floats: it
# resolves to opennms-36 today, and dists opennms-34/35/36 show it has moved
# before. Pointing at it means a plain `apt upgrade` could offer a *major*
# version jump once `stable` follows opennms-37. Using the explicit dist also
# silences apt's "Conflicting distribution ... expected stable but got
# opennms-NN" warning.
#
# Derived from the caller's own `opennms_version`, so the source line and the
# version pin resolve from one fact and cannot name different majors. Still
# overridable outright, which is the supported way to point at a mirror whose
# layout differs.
#
# `default(..., true)` rather than a plain default: an `opennms_version` that
# is defined but empty would otherwise render `opennms-`, and apt reports that
# as an unsigned repository three tasks later rather than as the empty version
# it is. Measured while testing the fallback path.
opennms_repo_dist: "opennms-{{ (opennms_version | default(opennms_repo_fallback_version, true)).split('.')[0] }}"
