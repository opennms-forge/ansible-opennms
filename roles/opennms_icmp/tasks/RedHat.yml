---
- name: Installing JICMP
  ansible.builtin.dnf:
    name: jicmp-{{ jicmp_version }}
    state: present
  tags:
    - opennms
    - icmp

- name: Installing JICMP6
  ansible.builtin.dnf:
    name: jicmp6-{{ jicmp6_version }}
    state: present
  tags:
    - opennms
    - icmp
