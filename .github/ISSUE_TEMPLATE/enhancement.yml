name: Enhancement
description: Propose a new role, option, or change in behaviour
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing a **new role**, note the scope rule: a role belongs in this
        collection only if OpenNMS has a wire to the system it deploys — a database it
        queries, a broker it publishes to, a store it writes to. Systems OpenNMS is
        *measured against* belong in the benchmark repository instead.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What are you trying to do that this collection makes hard or impossible?

        Describe the situation rather than the fix you have in mind — the underlying
        problem often has a better solution than the one that prompted the issue.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
      description: The change you are proposing, and roughly how you imagine it working.
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Which role
      description: Or "new role" if this needs one.
      placeholder: opennms_sentinel
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: |
        How are you handling this today? Overriding a variable, a custom task, patching
        a template, or simply not doing it? This tells us how urgent the gap is.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you discounted them.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this
          required: false
