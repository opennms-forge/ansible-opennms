---
name: ansible-opennms-lint
run-name: Validate the Ansible playbook
on:
  workflow_dispatch:
  push:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Install Ansible and ansible-lint
        run: pip install ansible-core==2.20.4 ansible-lint==26.3.0
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Check for plaintext credential regressions
        # Fail if the historical plaintext defaults reappear in role defaults
        # or committed group_vars. Scope excludes this workflow file by design.
        run: |
          set -eu
          matches=$(find roles/*/defaults inventory/group_vars -type f \
                      \( -name '*.yml' -o -name '*.yaml' \) \
                      -exec grep -nE 'p4a55word|oth3rP455w0rd' {} + || true)
          if [ -n "$matches" ]; then
            echo "::error::Plaintext credential detected in committed files:"
            echo "$matches"
            echo "Run indigo423.opennms.init_secrets and use vault references instead."
            exit 1
          fi
      - name: Run ansible-lint
        run: ansible-lint
