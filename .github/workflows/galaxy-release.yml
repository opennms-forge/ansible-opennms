---
name: galaxy-release
run-name: Publish collection to Ansible Galaxy
on:
  release:
    types: [published]

permissions:
  contents: read

# Serialise releases and never cancel one: a cancelled publish can leave a
# version on Galaxy that the GitHub release does not describe.
concurrency:
  group: galaxy-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # The same gates pull requests enforce, so a release cannot publish through
  # a weaker check than main accepted.
  gates:
    uses: ./.github/workflows/quality-gates.yml

  publish:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # attach the tarball and its attestation to the release
      id-token: write       # sign the provenance with the workflow's OIDC identity
      attestations: write   # store it in the repository's attestation log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Install the Python tooling
        run: pip install -r requirements-dev.txt
      - name: Verify galaxy.yml version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(awk '/^version:/ { print $2 }' galaxy.yml | tr -d '"' | tr -d "'")
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::galaxy.yml version (${ACTUAL}) does not match release tag (${TAG} -> ${EXPECTED}). Bump galaxy.yml before tagging."
            exit 1
          fi
      - name: Build collection
        run: ansible-galaxy collection build --output-path dist/
      # Provenance first, then publish: an attestation for a tarball that never
      # reached Galaxy is harmless, a Galaxy version with no attestation is the
      # state this step exists to prevent. Galaxy serves the uploaded bytes
      # unchanged, so `gh attestation verify` works on a download from either.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/indigo423-opennms-*.tar.gz
      - name: Publish collection to Ansible Galaxy
        env:
          GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: |
          ansible-galaxy collection publish \
            --token "${GALAXY_TOKEN}" \
            dist/indigo423-opennms-*.tar.gz
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" --clobber dist/indigo423-opennms-*.tar.gz
