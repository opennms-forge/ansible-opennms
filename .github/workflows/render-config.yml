---
name: render-config
run-name: Compare rendered configuration to expectations
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# The job only reads the checkout and renders templates locally. It makes no
# outbound requests and connects to no hosts.
permissions:
  contents: read

jobs:
  render-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install Ansible
        run: pip install ansible-core==2.20.4
      # Renders role templates against fixture inventories and compares the
      # result to recorded expectations. Catches string-level defects in
      # generated configuration — quoting, escaping, list joining, ordering,
      # single-node versus cluster shape — which ansible-lint cannot see,
      # because the YAML is valid either way.
      #
      # No collections are installed: the fixtures render templates and touch
      # no module outside ansible-core.
      - name: Compare rendered configuration
        run: make check-render
