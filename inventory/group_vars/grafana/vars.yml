---
# Grafana version — must be an exact version string or "latest"
# grafana.grafana collection constructs the apt package as grafana=<version>
# Pinned to 12.x: Grafana 13 breaks the collection's plugin install task
# (grafana-cli needs --homepath). Bump back to 13.x once upstream fixes this.
# See: https://github.com/grafana/grafana-ansible-collection/issues/497
grafana_version: "12.4.3"

# Repo management is handled automatically by the collection
grafana_manage_repo: true

# Service state
grafana_service_state: started
grafana_service_enabled: true

# OpenNMS Horizon connection — override these per environment as needed
onms_hzn_base_url: http://localhost:8980
onms_hzn_rest_url: "{{ onms_hzn_base_url }}/opennms"

# PostgreSQL datasource details inherit from inventory/group_vars/opennms_stack/
# (grafana is a child group of opennms_stack in the bundled inventories).
# Credentials resolve through the encrypted vault populated by:
#   ansible-playbook -i <inventory> indigo423.opennms.init_secrets

# Plugins — grafana.grafana.grafana installs these via grafana-cli
# NOTE: the collection has no variable for enabling/configuring app plugins.
# The opennms-opennms-app will be installed but enabling it requires a
# separate provisioning file under /etc/grafana/provisioning/plugins/.
grafana_plugins:
  - opennms-opennms-app

# Datasources — translated from stub_grafana templates/datasources/opennms-horizon.yml.j2
grafana_datasources:
  - name: OpenNMS Performance
    type: opennms-performance-datasource
    orgId: 1
    access: proxy
    url: "{{ onms_hzn_rest_url }}"
    isDefault: true
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin

  - name: OpenNMS Entity
    type: opennms-entity-datasource
    orgId: 1
    access: proxy
    url: "{{ onms_hzn_rest_url }}"
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin

  - name: OpenNMS Flow
    type: opennms-flow-datasource
    orgId: 1
    access: proxy
    url: "{{ onms_hzn_rest_url }}"
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: admin

  - name: postgres
    type: postgres
    orgId: 1
    access: proxy
    url: "{{ opennms_datasource_db_host }}:{{ opennms_datasource_db_port }}"
    database: "{{ opennms_datasource_db_name }}"
    user: "{{ opennms_datasource_db_user }}"
    secureJsonData:
      password: "{{ opennms_datasource_db_password }}"
    jsonData:
      postgresVersion: 1500
      sslmode: disable
      tlsAuth: false
      tlsSkipVerify: true
