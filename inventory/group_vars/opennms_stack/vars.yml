# Stack-level overrides for the OpenNMS deployment.
#
# Database credentials (opennms_datasource_db_password, postgres_password) are
# generated by indigo423.opennms.init_secrets and stored in the sibling vault.yml.
# Run this once after cloning or installing the collection:
#   ansible-playbook -i <inventory> indigo423.opennms.init_secrets
# Rotate with `-e force_rotate=true`.
#
# Only stack-wide values belong here. All four shipped inventories share this
# directory, so a topology's addresses would leak from one into the others.
# Endpoints — the database host, the Kafka bootstrap servers, the flow and
# time-series URLs — are declared in each inventory file's own group `vars:`
# blocks instead. See inventory/opennms-stack.yml.
#
# What follows documents the settings a topology may want; the reference
# inventory shows where to put them.
#
# Elasticsearch flow persistence
#
# Flow data can be persisted by Core (single-node) OR by one or more Sentinels.
# Enable it on exactly ONE of the two roles - never both.
#
# Core or Sentinel handles flow persistence
#   Set in group_vars for the Core host group or the Sentinel host group to handle flow persistence.
#
#   opennms_elastic_flows:
#     elasticUrl: http://elasticsearch-host:9200
#     globalElasticUser: elastic
#     globalElasticPassword: changeme
#     elasticIndexStrategy: monthly
#     maxFlowDurationMs: 120000
#     bulkSize: 1000
#     bulkRetryCount: 5
#     bulkFlushMs: 500
#     connTimeout: 5000
#     readTimeout: 30000
#     skipElasticsearchPersistence: "false"
#     useComposableTemplates: "false"

# Continuous profiling with the Grafana Pyroscope Java agent
#
# The agent jar is pinned by the collection and installed on all three
# components. Core loads it through its own launcher toggle; Minion and Sentinel
# load it when their dict is non-empty. Set these in the group_vars of the
# matching host group, and give each component a distinct application name.
#
# A server to receive the profiles comes from `stub_pyroscope` - put a host in
# the `pyroscope` group and the full-stack playbook deploys it on port 4040.
#
#   opennms_jvm_conf:            # Core - merged over the role defaults
#     PYROSCOPE_AGENT_ENABLED: 1
#     PYROSCOPE_SERVER_ADDRESS: http://pyroscope-host:4040
#
#   opennms_minion_pyroscope:
#     PYROSCOPE_APPLICATION_NAME: Horizon-Minion
#     PYROSCOPE_SERVER_ADDRESS: http://pyroscope-host:4040
#
#   opennms_sentinel_pyroscope:
#     PYROSCOPE_APPLICATION_NAME: Horizon-Sentinel
#     PYROSCOPE_SERVER_ADDRESS: http://pyroscope-host:4040
#
# Do NOT carry PYROSCOPE_AGENT_ENABLED over into the Minion or Sentinel dict.
# On Core it is read by bin/opennms, which wants a number. In those two dicts it
# reaches the agent itself, which parses it as a boolean - so `1` reads as false
# and the agent shuts itself down after attaching, logging one INFO line about
# it. Those two roles need no enable key at all; the populated dict is the
# toggle. If you set it, spell it `true`.
#
# Any other agent setting - PYROSCOPE_UPLOAD_INTERVAL, PYROSCOPE_AUTH_TOKEN,
# PYROSCOPE_HTTP_HEADERS - goes in the Minion and Sentinel dicts directly, but on
# Core it belongs in `opennms_env`, not `opennms_jvm_conf`: keys in the latter
# are not exported, and bin/opennms exports only the application name and
# server address by name.

# If you need set any of these settings here, you need to pull the whole dictionary from the opennms_core defaults
# We don't combine the dictionary here with the defaults
# See: https://github.com/opennms-forge/ansible-opennms/issues/4
# opennms_properties_webapp:
  # opennms.web.base-url: http://%x%c/
  # org.opennms.netmgt.jetty.host: 0.0.0.0
  # org.opennms.netmgt.jetty.port: 8980
  # org.opennms.netmgt.jetty.https-keystore: /opt/opennms/etc/jetty.keystore
  # org.opennms.netmgt.jetty.https-keystorepassword: changeit
  # org.opennms.netmgt.jetty.https-keypassword: changeit
  # org.opennms.netmgt.jetty.https-host: 127.0.0.1
  # org.opennms.netmgt.jetty.https-port: 8443
  # org.opennms.netmgt.jetty.ajp-port: 8981
  # org.opennms.netmgt.jetty.sendServerVersion: false
  # org.opennms.netmgt.jetty.enableRequestLogging: false
  # org.opennms.netmgt.jetty.requestHeaderSize: 4000
  # org.eclipse.jetty.server.Request.maxFormKeys: 2000
  # org.eclipse.jetty.server.Request.maxFormContentSize: 200000
  # org.opennms.netmgt.jetty.relativeRedirectAllowed=true
# indigo423.opennms.init_secrets managed section >>>
opennms_datasource_db_password: "{{ vault_opennms_db_password }}"
postgres_password: "{{ vault_postgres_password }}"
