config_extra:
  compactor:
    data_dir: /var/lib/mimir/compactor
    sharding_ring:
      instance_addr: 192.0.2.12
      kvstore:
        store: memberlist
  frontend:
    address: 192.0.2.12
  multitenancy_enabled: false
  store_gateway:
    sharding_ring:
      instance_addr: 192.0.2.12
      kvstore:
        store: memberlist
      replication_factor: 3

ingester:
  ring:
    instance_addr: 192.0.2.12
    kvstore:
      store: memberlist
    replication_factor: 3

distributor:
  ring:
    instance_addr: 192.0.2.12
    kvstore:
      store: memberlist

blocks_storage:
  backend: s3
  bucket_store:
    sync_dir: /var/lib/mimir/tsdb-sync
  s3:
    access_key_id: fixture-key
    bucket_name: mimir-blocks
    endpoint: rustfs.example.test:9000
    insecure: true
    secret_access_key: fixture-secret
  tsdb:
    dir: /var/lib/mimir/tsdb

memberlist:
  advertise_addr: 192.0.2.12
  advertise_port: 7946
  bind_port: 7946
  join_members:
  - mimir-01:7946
  - mimir-02:7946
  - mimir-03:7946
