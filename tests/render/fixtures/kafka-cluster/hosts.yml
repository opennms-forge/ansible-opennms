---
# Three brokers, declared out of order on purpose: node ids and quorum voters
# are derived from the member list, so an unsorted derivation would assign a
# different id to the same host between runs.
all:
  children:
    message_broker:
      hosts:
        kafka-03:
        kafka-01:
        kafka-02:
    render_target:
      hosts:
        kafka-02:
