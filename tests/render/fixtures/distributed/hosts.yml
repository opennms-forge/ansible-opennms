---
# Services on separate hosts, with three brokers — the topology issue #171 says
# no shipped inventory exercises. Sentinel derives its bootstrap list from the
# `message_broker` group, so this fixture is what proves that derivation, and
# proves it renders every broker rather than the first.
all:
  children:
    database:
      hosts:
        db-01:
    message_broker:
      hosts:
        kafka-03:
        kafka-01:
        kafka-02:
    sentinel:
      hosts:
        sentinel-01:
    render_target:
      hosts:
        sentinel-01:
