---
# Every service on one host, which is the only topology the shipped defaults
# support today (see issue #171). Pins that behaviour so a change intended to
# make distributed deployments work cannot quietly alter the colocated case.
#
# `render_target` is the group the harness runs as, so `inventory_hostname` and
# `groups` below are what the role's derivations see. Nothing is connected to:
# the play forces `connection: local`.
all:
  children:
    database:
      hosts:
        onms-01:
    message_broker:
      hosts:
        onms-01:
    core:
      hosts:
        onms-01:
    render_target:
      hosts:
        onms-01:
