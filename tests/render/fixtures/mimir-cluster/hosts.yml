# Three members, declared out of order on purpose: the join list is sorted so
# every node renders the same one, and an unsorted derivation would render a
# different list here on a different run.
all:
  children:
    mimir:
      hosts:
        mimir-03:
        mimir-01:
        mimir-02:
    render_target:
      hosts:
        mimir-02:
