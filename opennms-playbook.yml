---
- name: Manage PostgreSQL database
  hosts: database
  become: true
  roles:
    - common
    - stub_pgsql

- name: Manage Message broker
  hosts: message_broker
  become: true
  roles:
    - common
    - stub_kafka

- name: Manage Elasticsearch
  hosts: elasticsearch
  become: true
  roles:
    - common
    - stub_elasticsearch

- name: Manage Mimir
  hosts: mimir
  become: true
  roles:
    - common
    - stub_mimir

# Before the Horizon components, so a stack that has profiling switched on has
# somewhere to deliver to by the time their JVMs start. The agent tolerates an
# absent server — it retries — so the ordering is a convenience, not a
# requirement.
- name: Manage Pyroscope
  hosts: pyroscope
  become: true
  roles:
    - common
    - stub_pyroscope

- name: Manage Grafana
  hosts: grafana
  become: true
  roles:
    - common
    - indigo423.grafana.grafana
    - grafana_provisioning

- name: Manage OpenNMS Horizon Core system
  hosts: core
  become: true
  roles:
    - common
    - opennms_core

- name: Manage OpenNMS Horizon Minion
  hosts: minion
  become: true
  roles:
    - common
    - opennms_minion

- name: Manage OpenNMS Horizon Sentinel
  hosts: sentinel
  become: true
  roles:
    - common
    - opennms_sentinel
